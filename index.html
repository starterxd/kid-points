function toggleVoid(id){
  const e=S.ledger.find(x=>x.id===id);if(!e)return;
  const go=()=>{
    e.voided=!e.voided;touch(e);
    if(e.type==='bank-in'){          // 存入被撤銷 → 把那一筆從罐子裡拿掉，不留孤兒
      const j=S.savings.find(x=>!x.voided&&!x.claimedTs&&(x.ledgerIds||[]).indexOf(e.id)>=0);
      if(j){
        const amt=Math.abs(e.small);
        if(e.voided){
          const i=(j.moves||[]).findIndex(m=>m.delta===amt&&Math.abs(m.ts-e.ts)<2000);
          if(i>=0)j.moves.splice(i,1);
        }else j.moves.push({ts:e.ts,delta:amt});
        if(!(j.moves||[]).some(m=>m.delta>0)){j.voided=true}   // 一筆都不剩就整個罐子作廢
        touch(j);
      }
    }
    closeSheet();save();toast(e.voided?'已撤銷':'已恢復')};
  (S.settings.pinForUndo&&!unlocked())?askPin('撤銷需要家長密碼',go):go();
}

function readGhForm(){
  return{owner:$('#go').value.trim(),repo:$('#gr').value.trim(),branch:$('#gb').value.trim()||'main',
    path:$('#gp').value.trim()||'data.json',mediaPath:$('#gm').value.trim()||'media.json',token:$('#gt').value.trim()};

async function ghCheck(g){
  // 回傳 {ok:true, name, priv} 或 {ok:false, msg}
  if(!g.owner||!g.repo||!g.token)return{ok:false,msg:'帳號、repo、token 都要填'};
  const where=g.owner+'/'+g.repo;
  let r;
  try{
    r=await fetch('https://api.github.com/repos/'+g.owner+'/'+g.repo,
      {cache:'no-store',headers:{'Authorization':'Bearer '+g.token,'Accept':'application/vnd.github+json',
        'X-GitHub-Api-Version':'2022-11-28'}});
  }catch(e){return{ok:false,msg:'連不上網路，請確認連線後再試'}}
  if(r.status===401)return{ok:false,msg:'Token 無效或已過期，請到 GitHub 重新產生一組'};
  if(r.status===403)return{ok:false,msg:'Token 權限不足（要開這個 repo 的 Contents: Read and write）'};
  if(r.status===404)return{ok:false,msg:'找不到 '+where+'　請檢查帳號 / repo 名稱有沒有打錯，或 Token 有沒有授權這個 repo'};
  if(!r.ok)return{ok:false,msg:'GitHub 回了 HTTP '+r.status+'，稍後再試'};
  const j=await r.json();
  if(j.permissions&&j.permissions.push===false)
    return{ok:false,msg:'這個 Token 只能讀不能寫，請改成 Contents: Read and write'};
  return{ok:true,name:j.full_name,priv:!!j.private};
}
async function ghTest(){
  const msg=$('#gmsg');msg.innerHTML='檢查中…';
  const res=await ghCheck(readGhForm());
  msg.innerHTML=res.ok
    ? '<b style="color:var(--good)">'+px('✅')+' 連線成功</b>　'+esc(res.name)+(res.priv?'（私有）':'（公開）')
    : '<b class="danger">'+px('❌')+' '+esc(res.msg)+'</b>';
}
async function ghSave(){
  const g=readGhForm(),msg=$('#gmsg');

  GH=Object.assign(g,{ok:true});LS.set(K_GH,GH);shaCache={};LS.set(K_SHA,{});
  closeSheet();toast('連線成功，開始同步');pull(true).then(()=>{if(dirty)push()});
}

    case 'cpnstack':return cpnStackSheet(id);
    case 'stackhelp':return sheet('🎫 計價券是什麼',
      '<div class="f hint" style="line-height:1.9">券面標著金額的券，例如<b>小零食券一張 NT$'+VOUCHER['小零食券'].faceNTD+'</b>。<br>'+
      '拿到之後<b>可以先存著</b>，等要用的時候一次拿好幾張出來折抵 —— '+esc(VOUCHER['小零食券'].where)+'。<br>'+
      '玩大富翁拿到的計價券<b>不佔每週獎勵額度</b>，因為它不是用分數換來的。</div>'+
      '<button class="btn pri wide" style="margin-top:12px" data-act="close">知道了</button>');
    case 'sq-':{stackQty=Math.max(1,stackQty-1);return drawStack()}
    case 'sq+':{stackQty=Math.min(stackItems(stackRw).length||1,stackQty+1);return drawStack()}
    case 'usestack':return useStack();
    case 'cancelstack':return cancelStack();
    case 'usecpn':closeSheet();return useCoupon(id);
    case 'cancelcpn':return cancelCoupon(id);
    case 'rt':return toggleRoutine(t.dataset.kid,id);
    case 'rule':return applyRule(id,t.dataset.ask==='1');
    case 'ruleFor':{closeSheet();selKid=t.dataset.kid;return applyRule(id,false)}
    case 'manual':return manualSheet();
    case 'mdo':{
      const k=$('#mk').value,u=$('#mu').value,n=Math.max(1,parseInt($('#ma').value)||1);
      const lbl=$('#ml').value.trim()||(t.dataset.s==='1'?'自訂加分':'自訂扣分');
      closeSheet();return addPoints(k,toSmall(u,n)*(t.dataset.s==='1'?1:-1),lbl,{type:'adjust',emoji:'✎'});
    }
    case 'redeem':return doRedeem(id);
    case 'dordm':{const w=rwOf(id);return isStackRw(w)?qtySheet(id,t.dataset.kid):finishRedeem(id,t.dataset.kid)}
    case 'dordmq':return finishRedeem(rdmW,rdmK,rdmQty);
    case 'rq-':{const w=rwOf(rdmW);rdmQty=clamp(rdmQty-1,1,maxQty(w,rdmK));return qtySheet(rdmW,rdmK)}
    case 'rq+':{const w=rwOf(rdmW);rdmQty=clamp(rdmQty+1,1,maxQty(w,rdmK));return qtySheet(rdmW,rdmK)}
    case 'entry':return entrySheet(id);
    case 'toggleVoid':return toggleVoid(id);
    case 'syncpanel':return ghReady()?(view='set',render(),window.scrollTo(0,0)):ghSetup();

    case 'mkids':return manageKids();
    case 'editkid':keepScroll();return editKid(id);
    case 'pickav':return pickImage(d=>el._setav(putMedia(d)));
    case 'rmav':return el._setav(null);
    case 'savekid':{
      const g=el._get(),nm=g.name||'寶貝';
      if(id){const k=kid(id);Object.assign(k,{name:nm,color:g.color,avatar:g.avatar});touch(k)}
      else S.kids.push(touch({id:uid('k'),name:nm,color:g.color,avatar:g.avatar,sort:S.kids.length}));
      save({media:true});backTo(manageKids);return toast('已儲存');
    }
    case 'delkid':{
      if(!confirm('刪除後這位小孩的分數與紀錄不再顯示，確定？'))return;
      const k=kid(id);k.deleted=true;touch(k);if(selKid===id)selKid=null;save();backTo(manageKids);return toast('已刪除');
    }
    case 'mrt':return manageRt();
    case 'editrt':keepScroll();return editRt(id);
    case 'savert':{
      const g=el._get();
      const o={label:$('#tl').value.trim()||'未命名',emoji:$('#te').value.trim()||'⭐',
               dice:clamp(parseInt($('#td').value)||0,0,9),kidIds:g.kidIds};
      if(id)Object.assign(touch(S.routines.find(x=>x.id===id)),o);
      else S.routines.push(touch(Object.assign({id:uid('t'),sort:S.routines.length},o)));
      save();backTo(manageRt);return toast('已儲存');
    }
    case 'delrt':{const r=S.routines.find(x=>x.id===id);r.deleted=true;touch(r);save();backTo(manageRt);return toast('已刪除')}
    case 'rtbonus':return rtBonusSheet();
    case 'savertb':{
      const st=S.settings;
      st.routineAllBonus=Math.max(0,parseInt($('#b1').value)||0);
      st.streak3Bonus=Math.max(0,parseInt($('#b2').value)||0);
      st.streak7Bonus=Math.max(0,parseInt($('#b3').value)||0);
      st.dicePerPoints=Math.max(1,parseInt($('#b4').value)||5);
      touch(st);closeSheet();save();return toast('已儲存');
    }
    case 'mrules':return manageRules();
    case 'editrule':keepScroll();return editRule(id,t.dataset.kind);
    case 'saverule':{
      const o={label:$('#rl').value.trim()||'未命名',emoji:$('#re').value.trim(),kind:$('#rk').value,
               group:$('#rg')?$('#rg').value:'daily',
               unit:$('#ru').value,amount:Math.max(1,parseInt($('#ra').value)||1)};
      if(id)Object.assign(touch(S.rules.find(x=>x.id===id)),o);
      else S.rules.push(touch(Object.assign({id:uid('r'),sort:S.rules.length},o)));
      save();backTo(manageRules);return toast('已儲存');
    }
    case 'delrule':{const r=S.rules.find(x=>x.id===id);r.deleted=true;touch(r);save();backTo(manageRules);return toast('已刪除')}
    case 'calcpts':{
      const pr=Math.max(0,parseInt($('#wp').value)||0);
      if(!pr)return toast('先填價格');
      const small=Math.max(1,Math.round(pr/NTD()));
      if(small>=BU()&&small%BU()===0){$('#wu').value='big';$('#wa').value=small/BU()}
      else{$('#wu').value='small';$('#wa').value=small}
      return toast('NT$'+pr+' → '+small+' 小分');
    }
    case 'mrw':return manageRw();
    case 'editrw':keepScroll();return editRw(id);
    case 'pickrw':return pickImage(d=>el._setimg(d));
    case 'rmrw':return el._setimg(null);
    case 'saverw':{
      const g=el._get(),st=$('#ws').value.trim();
      const pr=$('#wp').value.trim();
      const o={name:$('#wn').value.trim()||'未命名',emoji:$('#we').value.trim()||'🎁',
        unit:$('#wu').value,amount:Math.max(1,parseInt($('#wa').value)||1),
        price:pr===''?null:Math.max(0,parseInt(pr)||0),noBudget:$('#wb')?$('#wb').value==='1':false,
        stack:$('#wq')?$('#wq').value==='1':false,
        stock:st===''?null:Math.max(0,parseInt(st)||0),note:$('#wt').value.trim(),kidIds:g.kidIds};
      let media=false;
      if(g.img&&g.img.startsWith('data:')){o.image=putMedia(g.img);media=true}else if(!g.img)o.image=null;
      if(id){const w=S.rewards.find(x=>x.id===id);if(g.img&&!g.img.startsWith('data:'))o.image=w.image;Object.assign(touch(w),o)}
      else S.rewards.push(touch(Object.assign({id:uid('w'),sort:S.rewards.length},o)));
      save({media});backTo(manageRw);return toast('已儲存');
    }
    case 'delrw':{const w=S.rewards.find(x=>x.id===id);w.deleted=true;touch(w);save();backTo(manageRw);return toast('已刪除')}

    case 'bankkeep':{
      const v=prompt('存款要在身上留多少小分？\n（留著才扣得到分，填 0 = 可以全部存進去）',String(bankKeep()));
      if(v==null)return;
      S.settings.bankKeep=Math.max(0,parseInt(v)||0);touch(S.settings);save();
      return toast(bankKeep()?'身上要留 '+bankKeep()+' 小分':'已取消保留');
    }
    case 'dcap':{
      const v=prompt('每天「日常加分」最多可以拿幾小分？（填 0 = 不限）',String(dailyCap()));
      if(v==null)return;
      S.settings.dailyEarnCap=Math.max(0,parseInt(v)||0);touch(S.settings);save();
      return toast(dailyCap()?'每天最多 '+dailyCap()+' 小分':'已取消每天上限');
    }
    case 'bankgoal':{
      const ti=bankTiers();
      sheet('🏦 存款上限與速度',
        '<div class="f hint" style="margin-top:-6px;line-height:1.8">'+
        '利息用「<b>分·天</b>」算：罐子裡每 1 分放 1 天 ＝ 1 點。累積到<b>門檻</b>點就換 1 分利息。<br>'+
        '<b>門檻越小＝賺越快</b>，所以後面的階段門檻要設得比前面小。</div>'+
        '<div class="f"><label>一輪最多可以賺幾分</label><input id="bcap" type="number" inputmode="numeric" min="1" value="'+bankCap()+'">'+
        '<div class="hint">預設 25 分（三個月）。</div></div>'+
        ti.map((t,i)=>'<div class="f2"><div class="f"><label>第 '+(i+1)+' 段天數</label>'+
          '<input id="bd'+i+'" type="number" inputmode="numeric" min="1" value="'+t[0]+'"></div>'+
          '<div class="f"><label>門檻（分·天 換 1 分）</label>'+
          '<input id="bt'+i+'" type="number" inputmode="numeric" min="1" value="'+t[1]+'"></div></div>').join('')+
        '<div class="f hint">目前一輪 '+bankCycle()+' 天。20 分的罐子每天可以賺：'+
          ti.map(t=>'+'+(20/t[1]).toFixed(2)).join(' → ')+'</div>'+
        '<button class="btn pri wide" data-act="savebank">儲存</button>');
      return;
    }
    case 'savebank':{
      const out=[];
      for(let i=0;i<3;i++){
        const d=parseInt(($('#bd'+i)||{}).value), t=parseInt(($('#bt'+i)||{}).value);
        out.push([clamp(isNaN(d)?30:d,1,365), Math.max(1,isNaN(t)?100:t)]);
      }
      S.settings.bankTiers=out;
      S.settings.bankCapGain=Math.max(1,parseInt($('#bcap').value)||25);
      touch(S.settings);closeSheet();save();
      return toast(bankCycle()+' 天一輪，最多 +'+bankCap()+' 分');
    }
    case 'budget':{
      const v=prompt('每人每週的實體獎勵額度是多少元？\n（只有標價格的獎勵會扣額度，特權型不扣；沒用完會累積）',weeklyNTD());
      if(v==null)return;
      S.settings.weeklyBudgetNTD=Math.max(0,parseInt(v)||0);touch(S.settings);save();
      return toast('每週額度 NT$'+weeklyNTD());
    }
    case 'ntdrate':{
      const v=prompt('1 小分 = 幾元？（獎勵品價格換算用）',NTD());if(v==null)return;
      const n=clamp(parseInt(v)||10,1,1000);S.settings.ntdPerSmall=n;touch(S.settings);save();
      return toast('1 小分 = NT$'+n+'（1 大分 = NT$'+(n*BU())+'）');
    }
    case 'reseed':{
      if(!confirm('把「規則」與「獎勵品」換成最新預設清單？\n小孩、分數、紀錄都會保留。'))return;
      const fresh=seed();
      for(const r of S.rules)if(!r.deleted){r.deleted=true;touch(r)}
      for(const w of S.rewards)if(!w.deleted){w.deleted=true;touch(w)}
      S.rules=S.rules.concat(fresh.rules);S.rewards=S.rewards.concat(fresh.rewards);
      S.needsSeedRefresh=false;touch(S.settings);closeSheet();save();return toast('已載入最新預設清單');
    }
    case 'bigunit':{
      const v=prompt('1 大分 = 幾小分？（建議 5）',BU());if(v==null)return;
      const n=clamp(parseInt(v)||5,2,50);S.settings.bigUnit=n;touch(S.settings);save();return toast('1 大分 = '+n+' 小分');
    }
    case 'tgneg':S.settings.allowNegative=!S.settings.allowNegative;touch(S.settings);return save();
    case 'tgbankonce':S.settings.bankOncePerDay=!bankOnce();touch(S.settings);return save();
    case 'tgundo':S.settings.pinForUndo=!S.settings.pinForUndo;touch(S.settings);return save();
    case 'tgredeem':S.settings.pinForRedeem=!S.settings.pinForRedeem;touch(S.settings);return save();
    case 'tgsound':S.settings.sound=!S.settings.sound;touch(S.settings);beep('good');return save();
    case 'tghap':S.settings.haptics=!S.settings.haptics;touch(S.settings);buzz();return save();
    case 'theme':{
      const o=['auto','light','dark'],i=(o.indexOf(S.settings.theme)+1)%3;
      S.settings.theme=o[i];touch(S.settings);applyTheme();return save();
    }
    case 'setpin':return setPinSheet();
    case 'savepin':{
      const a=$('#p1').value.trim(),b=$('#p2').value.trim();
      if(a===''&&b===''){S.settings.pinHash=null;touch(S.settings);closeSheet();save();return toast('已取消密碼')}
      if(!/^\d{4}$/.test(a))return toast('請輸入 4 位數字');
      if(a!==b)return toast('兩次輸入不一樣');
      S.settings.pinHash=h33(a);touch(S.settings);unlockUntil=now()+10*60*1000;closeSheet();save();return toast('密碼已設定');
    }
    case 'ghsetup':return ghSetup();
    case 'ghtest':return ghTest();
    case 'ghsave':return ghSave();
    case 'dup':return dupSheet();
    case 'dodup':return dupClean();
    case 'ver':return newBuild?location.reload():checkUpdate(false);
    case 'doupdate':return location.reload();
    case 'ghpull':return pull();
    case 'ghpush':return push().then(()=>toast(syncState==='err'?'上傳失敗：'+syncMsg:'已上傳'));
    case 'backup':return backupSheet();
    case 'dlbak':{
      const blob=new Blob([JSON.stringify({state:S,media:M},null,1)],{type:'application/json'});
      const u=URL.createObjectURL(blob),aa=document.createElement('a');
      aa.href=u;aa.download='kidpoints-'+new Date().toISOString().slice(0,10)+'.json';aa.click();
      setTimeout(()=>URL.revokeObjectURL(u),3000);return;
    }
    case 'dobak':{
      try{
        const j=JSON.parse($('#bk').value);
        if(j.state)S=migrate(mergeState(S,j.state));
        if(j.media)M=mergeMedia(M,j.media);
        closeSheet();save({media:true});return toast('已還原合併');
      }catch(e){return toast('JSON 格式不正確')}
    }
    case 'clearlog':return sheet('🧹 重新開始',
      '<div class="f hint" style="margin-top:-6px;line-height:1.9">下面這些會<b>全部歸零</b>：<br>'+
      '・分數與所有加減分紀錄<br>・累積總分（骰子的來源）<br>・日常任務的打勾與連續天數<br>'+
      '・所有券、銀行存款<br>・大富翁棋子位置、圈數、已用骰子<br>・本週獎勵額度（重新從這週算）</div>'+
      '<div class="f hint" style="line-height:1.9">會<b>保留</b>：小孩、加減分規則、獎勵品、日常任務項目、所有設定。</div>'+
      '<button class="btn bad wide" data-act="doclear">確定，全部歸零</button>'+
      '<button class="btn ghost wide" style="margin-top:8px" data-act="close">取消</button>');
    case 'doclear':{
      const t=now();
      S.ledger=[];S.routineLog=[];S.coupons=[];S.savings=[];
      S.game.players={};S.game.lastRoll=1;S.game.updatedAt=t;
      S.settings.ledgerClearedAt=t;
      S.settings.archive={ts:0,bal:{},earn:{}};        // 歸檔底數也要清，不然分數會留著
      S.settings.budgetStartTs=startOfWeek();
      touch(S.settings);closeSheet();save();
      return toast('✨ 全部歸零了，可以重新開始');
    }
    case 'reset':{
      if(!confirm('回復成預設資料？現有小孩、規則、獎勵、紀錄都會不見。'))return;
      S=seed();M={updatedAt:now(),items:{}};selKid=null;save({media:true});return toast('已回復預設');
    }
  }
});

/* ---------- 主題 / 啟動 ---------- */
function applyTheme(){
  const t=S.settings.theme||'auto';
  document.documentElement.setAttribute('data-theme',t==='auto'?'':t);
  if(t==='auto')document.documentElement.removeAttribute('data-theme');
}
applyTheme();
render();
if(firstRun)setTimeout(()=>{if(!$('#toast').classList.contains('on'))toast('👋 先去「設定」改小孩名字和規則')},900);
if(ghReady())pull(true);
setTimeout(()=>checkUpdate(true),2500);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkUpdate(true)});
window.KP={get S(){return S},get M(){return M},addPoints,applyRule,save,touch,dailyEarned,dailyLeft,dailyCap,budgetAvail,finishRedeem,usesBudget,LS,balanceOf,fmtScore,mergeState,mergeLedger,render,
  diceOf,streakOf,allDone,doneCount,routineDone,routinesFor,dayKey,toggleRoutine,
  budgetAvail,budgetUsed,budgetAllowance,usedThisWeek,couponsOf,issueCoupon,useCoupon,weeklyNTD,
  groupCpns,isStackRw,faceOf,maxQty,rwOf,qtySheet,useStack,cancelStack,cpnStackSheet,VOUCHER,gCoupon,
  debtOf,depositable,bankKeep,bankOnce,depositedToday,claimedToday,sinceOf,netDelta,isTransfer,earnDelta,
  deposit,diceLog,budgetAvail,set logTab(v){logTab=v},diceOf,allDone,bankedOf,interestOf,
  jarOf,jarValue,jarDaysLeft,jarProject,jarGainIn,claimJar,withdrawJar,setJarTarget,bankCap,bankCycle,bankTiers,tierAt,toggleVoid,
  rollDice,gp,tileAt,step,applyCard,rollResult,gameHelpSheet,slotHTML,runSlot,uniqTiles,shieldsOf,landOn,lapBonus,chainCap,mergeGame,offerShield,applyBad,tileDesc,tileSheet,
  calcSheet,gameHelpSheet,compactOld,oldCount,archiveCut,chartSeries,chartBox,earnedOf,arcOf,
  px,pxi,fi,FLAT,PXKEYS,icoField,ghSetup,ghCheck,closeSheet,editRule,editRw,editRt,editKid,toggleRoutine,
  pull,push,checkUpdate,dupFind,dupCount,dupClean,migrate,BUILD,
  get newBuild(){return newBuild},set newBuild(v){newBuild=v},
  rarityOf:w=>rarity(toSmall(w.unit,w.amount)),
  set rwRar(v){rwRar=v},get rwRar(){return rwRar},
  set chartRange(v){chartRange=v},get chartRange(){return chartRange},
  set chartPick(v){chartPick=v},get chartPick(){return chartPick},
  get gPending(){return gPending},set gPending(v){gPending=v},
  set depAmt(v){depAmt=v},get depAmt(){return depAmt},
  set rwTab(v){rwTab=v;render()},get rwTab(){return rwTab},
  set view(v){view=v;render()},get view(){return view},set selKid(v){selKid=v},get selKid(){return selKid}};
</script>
