<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#5b6cff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="寶貝積分">
<title>寶貝積分</title>
<style>
:root{
  --bg:#e9edfa; --bg2:#dfe5f8; --surface:#fff; --surface2:#f5f7ff; --ink:#111a30; --muted:#6a7492; --line:#e0e6f5;
  --brand:#4353ff; --brand-soft:#e9ebff; --good:#0fa66f; --good-soft:#e3f8ef;
  --bad:#e8474b; --bad-soft:#ffe9ea; --gold:#e08700; --gold-soft:#fff2da;
  --shadow:0 1px 2px rgba(16,24,48,.06), 0 10px 26px rgba(16,24,48,.09);
  --glow:0 0 0 rgba(0,0,0,0);
  --r:18px; --r-sm:12px; --nav:66px;
  --c1:#7c879f; --c2:#12a150; --c3:#2f7cf6; --c4:#9b4dff; --c5:#f0a000;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#070a13; --bg2:#0d1220; --surface:#151b2c; --surface2:#1b2235; --ink:#eaf0ff; --muted:#8d99ba; --line:#28304a;
  --brand:#7f8dff; --brand-soft:#1e2544; --good:#2fd493; --good-soft:#102e26;
  --bad:#ff7276; --bad-soft:#33191d; --gold:#ffbc4d; --gold-soft:#332612;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px rgba(0,0,0,.45);
  --c1:#98a2bd; --c2:#35d98a; --c3:#5b9dff; --c4:#b478ff; --c5:#ffc247;
}}
:root[data-theme="dark"]{
  --bg:#070a13; --bg2:#0d1220; --surface:#151b2c; --surface2:#1b2235; --ink:#eaf0ff; --muted:#8d99ba; --line:#28304a;
  --brand:#7f8dff; --brand-soft:#1e2544; --good:#2fd493; --good-soft:#102e26;
  --bad:#ff7276; --bad-soft:#33191d; --gold:#ffbc4d; --gold-soft:#332612;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px rgba(0,0,0,.45);
  --c1:#98a2bd; --c2:#35d98a; --c3:#5b9dff; --c4:#b478ff; --c5:#ffc247;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{touch-action:manipulation}
button,.li,.rule,.kid,.chip,.rwc,.sw,.nb,.tg,.pad button{touch-action:manipulation;-webkit-user-select:none;user-select:none}
html,body{margin:0;padding:0}
body{
  color:var(--ink); min-height:100vh;
  background:
    radial-gradient(1100px 480px at 50% -180px, color-mix(in srgb,var(--brand) 16%,transparent), transparent 70%),
    var(--bg);
  background-attachment:fixed;
  font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  padding-bottom:calc(var(--nav) + env(safe-area-inset-bottom) + 12px);
  overscroll-behavior-y:none;
}
.wrap{max-width:600px;margin:0 auto;padding:0 14px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
input,select,textarea{font-size:16px}

/* ---- header ---- */
header{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);
  border-bottom:1px solid color-mix(in srgb,var(--line) 70%,transparent);padding-top:env(safe-area-inset-top)}
.hrow{max-width:600px;margin:0 auto;padding:10px 14px;display:flex;align-items:center;gap:10px}
.logo{font-weight:850;font-size:17px;letter-spacing:.2px;display:flex;align-items:center;gap:8px}
.logo span{width:27px;height:27px;border-radius:8px;display:grid;place-items:center;font-size:15px;
  background:linear-gradient(150deg,var(--c5),var(--c4));box-shadow:0 3px 10px color-mix(in srgb,var(--c4) 45%,transparent)}
.sync{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:var(--muted);
  background:var(--surface);border:1px solid var(--line);padding:5px 10px;border-radius:999px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted);flex:0 0 auto}
.dot.ok{background:var(--good)} .dot.warn{background:var(--gold)} .dot.err{background:var(--bad)}
.dot.busy{background:var(--brand);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.25}}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.sec{margin:18px 0 9px;display:flex;align-items:center;gap:8px}
.sec h2{margin:0;font-size:12px;font-weight:800;color:var(--muted);letter-spacing:1.4px;text-transform:uppercase}
.sec .more{margin-left:auto;font-size:13px;color:var(--brand);font-weight:700}

/* ============ 卡框系統 ============ */
.tcg{position:relative;border-radius:var(--r);padding:2px;background:linear-gradient(160deg,var(--rc),color-mix(in srgb,var(--rc) 25%,var(--surface)));
  box-shadow:var(--shadow);--rc:var(--c1)}
.tcg.r2{--rc:var(--c2)} .tcg.r3{--rc:var(--c3)} .tcg.r4{--rc:var(--c4)} .tcg.r5{--rc:var(--c5)}
.tcg.r4,.tcg.r5{box-shadow:var(--shadow),0 0 22px color-mix(in srgb,var(--rc) 32%,transparent)}
.tcg-in{position:relative;border-radius:calc(var(--r) - 2px);background:var(--surface);overflow:hidden;height:100%;display:flex;flex-direction:column}
.tcg.holo .tcg-in:after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;
  background:conic-gradient(from 210deg,#ff5f6d22,#ffc37122,#3ef0c722,#5b8cff22,#c86dff22,#ff5f6d22);
  mix-blend-mode:soft-light;opacity:.85;animation:holo 7s linear infinite}
@keyframes holo{to{filter:hue-rotate(360deg)}}
.rarity{display:flex;gap:1px;font-size:11.5px;font-weight:900;letter-spacing:-.5px;color:var(--rc);
  text-shadow:0 0 7px color-mix(in srgb,var(--rc) 55%,transparent)}

/* ---- 訓練卡（小孩） ---- */
.kidgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(158px,1fr))}
.kid{--rc:var(--kc);position:relative;border-radius:var(--r);padding:2px;text-align:left;display:block;width:100%;
  background:linear-gradient(155deg,var(--kc),color-mix(in srgb,var(--kc) 22%,var(--surface)));
  box-shadow:var(--shadow),0 0 18px color-mix(in srgb,var(--kc) 22%,transparent);transition:transform .12s}
.kid:active{transform:scale(.975)}
.kid .in{border-radius:calc(var(--r) - 2px);background:var(--surface);padding:12px 12px 13px;position:relative;overflow:hidden}
.kid .in:before{content:"";position:absolute;inset:-40% -20% auto -20%;height:120px;border-radius:50%;
  background:radial-gradient(closest-side,color-mix(in srgb,var(--kc) 26%,transparent),transparent)}
.kid .top{position:relative;display:flex;align-items:center;gap:9px;margin-bottom:11px}
.av{width:44px;height:44px;border-radius:13px;object-fit:cover;background:var(--kc);display:grid;place-items:center;color:#fff;
  font-weight:850;font-size:17px;flex:0 0 auto;box-shadow:0 3px 10px color-mix(in srgb,var(--kc) 45%,transparent)}
.kid .nm{font-weight:850;font-size:15.5px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kid .sub{font-size:10.5px;color:var(--muted);font-weight:600;letter-spacing:.3px}
.bigscore{display:flex;align-items:baseline;gap:4px;position:relative}
.bigscore b{font-size:36px;font-weight:850;letter-spacing:-2px;line-height:1;
  background:linear-gradient(160deg,var(--ink),color-mix(in srgb,var(--kc) 70%,var(--ink)));-webkit-background-clip:text;background-clip:text;color:transparent}
.bigscore i{font-style:normal;font-size:11px;color:var(--muted);font-weight:800;letter-spacing:.5px}
.smallscore{font-size:11.5px;color:var(--muted);margin-top:3px;position:relative;font-weight:600}
.pips{display:flex;gap:4px;margin-top:10px;position:relative}
.pips i{flex:1;height:7px;border-radius:99px;background:var(--line);transition:.3s}
.pips i.on{background:var(--kc);box-shadow:0 0 8px color-mix(in srgb,var(--kc) 55%,transparent)}
.kid .todo{margin-top:9px;font-size:11px;font-weight:700;color:var(--muted);display:flex;gap:8px;position:relative}
.kid .todo b{color:var(--good)} .kid .todo u{text-decoration:none;color:var(--bad)}

/* ---- 按鈕 ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:46px;padding:0 16px;border-radius:var(--r-sm);
  font-weight:750;font-size:15px;background:var(--surface);border:1px solid var(--line);color:var(--ink);box-shadow:var(--shadow)}
.btn:active{transform:scale(.97)}
.btn.pri{background:linear-gradient(150deg,var(--brand),color-mix(in srgb,var(--c4) 55%,var(--brand)));color:#fff;border-color:transparent;
  box-shadow:0 4px 16px color-mix(in srgb,var(--brand) 45%,transparent)}
.btn.good{background:var(--good);color:#fff;border-color:transparent}
.btn.bad{background:var(--bad);color:#fff;border-color:transparent}
.btn.ghost{box-shadow:none;background:transparent}
.btn.sm{min-height:36px;padding:0 12px;font-size:13.5px;border-radius:10px}
.btn.wide{width:100%}
.btn[disabled]{opacity:.42;pointer-events:none}
.row{display:flex;gap:9px} .row>*{flex:1}

/* ---- chips ---- */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;display:flex;align-items:center;gap:7px;padding:6px 13px 6px 6px;border-radius:999px;border:1.5px solid var(--line);
  background:var(--surface);font-weight:750;font-size:14px;white-space:nowrap}
.chip .av{width:28px;height:28px;border-radius:9px;font-size:12px;box-shadow:none}
.chip.on{border-color:var(--kc);background:color-mix(in srgb,var(--kc) 13%,var(--surface));box-shadow:0 0 14px color-mix(in srgb,var(--kc) 25%,transparent)}
.chip.plain{padding:7px 13px;font-size:13px}
.chip.plain.on{border-color:var(--brand);background:var(--brand-soft);color:var(--brand)}

/* ---- 規則按鈕 ---- */
.rules{display:grid;gap:9px;grid-template-columns:repeat(auto-fill,minmax(152px,1fr))}
.rule{display:flex;align-items:center;gap:9px;padding:10px;border-radius:var(--r-sm);text-align:left;
  background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);min-height:58px}
.rule:active{transform:scale(.96)}
.rule .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:18px;flex:0 0 auto;
  background:var(--good-soft);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--good) 18%,transparent)}
.rule.dd .ic{background:var(--bad-soft);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--bad) 18%,transparent)}
.rule .tx{min-width:0;flex:1}
.rule .tx b{display:block;font-size:13.5px;font-weight:700;line-height:1.25}
.rule .tx u{text-decoration:none;font-size:11.5px;color:var(--good);font-weight:800}
.rule.dd .tx u{color:var(--bad)}

/* ---- 獎勵卡 ---- */
.rw{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(152px,1fr))}
.rwc{text-align:left}
.rwc:active{transform:scale(.975)}
.rwc .hd{display:flex;align-items:center;padding:7px 9px 4px;gap:6px}
.rwc .ntd{margin-left:auto;font-size:9.5px;font-weight:850;color:var(--muted);letter-spacing:.3px;
  background:var(--surface2);border:1px solid var(--line);padding:2px 6px;border-radius:6px}
.rwc .art{aspect-ratio:1/.82;display:grid;place-items:center;font-size:44px;overflow:hidden;margin:0 8px;border-radius:10px;
  background:radial-gradient(closest-side,color-mix(in srgb,var(--rc) 22%,var(--surface2)),var(--surface2));
  box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--rc) 22%,transparent)}
.rwc .art img{width:100%;height:100%;object-fit:cover}
.rwc .bd{padding:9px 10px 10px;flex:1;display:flex;flex-direction:column}
.rwc .bd b{display:block;font-size:13px;font-weight:800;line-height:1.32;margin-bottom:6px}
.cost{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:850;color:#fff;
  background:linear-gradient(150deg,var(--rc),color-mix(in srgb,var(--rc) 60%,#000));padding:3px 9px;border-radius:999px;align-self:flex-start}
.rwc .who{margin-top:auto;padding-top:8px;display:flex;gap:5px;flex-wrap:wrap}
.pill{font-size:10px;font-weight:800;padding:2px 7px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.pill.yes{background:var(--good-soft);border-color:transparent;color:var(--good)}
.stock{font-size:10.5px;color:var(--muted);margin-top:5px;font-weight:600}
.rwc[disabled]{opacity:.45}

/* ---- 清單 ---- */
.list{border-radius:var(--r);overflow:hidden;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.li{display:flex;align-items:center;gap:11px;padding:11px 13px;border-bottom:1px solid var(--line);text-align:left;width:100%}
.li:last-child{border-bottom:0}
.li .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:16px;flex:0 0 auto;background:var(--surface2)}
.li .tx{flex:1;min-width:0}
.li .tx b{display:block;font-size:14px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .tx u{text-decoration:none;font-size:11.5px;color:var(--muted)}
.delta{font-weight:850;font-size:14.5px;flex:0 0 auto}
.delta.p{color:var(--good)} .delta.n{color:var(--bad)}
.li.void{opacity:.42} .li.void .tx b{text-decoration:line-through}
.daylab{font-size:11.5px;font-weight:850;color:var(--muted);padding:15px 3px 7px;letter-spacing:1px}
.empty{text-align:center;color:var(--muted);padding:36px 16px;font-size:14px}
.empty .e{font-size:42px;display:block;margin-bottom:8px;opacity:.55}

/* 大富翁 */
.board{display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(7,1fr);gap:5px;
  aspect-ratio:5/7;margin-top:12px}
.tl{position:relative;background:var(--surface2);border:1.5px solid var(--line);border-radius:10px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:3px;overflow:visible}
.tl.corner{background:var(--surface);border-width:2px}
.tl .n{position:absolute;top:2px;left:4px;font-size:8px;color:var(--muted);opacity:.7;font-weight:700}
.tl .e{font-size:17px;line-height:1}
.tl .l{font-size:8.5px;font-weight:750;line-height:1;text-align:center}
.tl.here{outline:2.5px solid var(--gold);outline-offset:-2px}
.tok{position:absolute;bottom:-6px;right:-4px;width:26px;height:26px;border-radius:9px;object-fit:cover;
  border:2px solid var(--bg);display:grid;place-items:center;font-size:11px;font-weight:850;color:#fff;z-index:2}
.tok.t2{right:auto;left:-4px;bottom:-6px}
.mid{grid-row:2/7;grid-column:2/5;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;padding:10px}
.die{width:66px;height:66px;border-radius:14px;background:var(--ink);display:grid;
  grid-template-columns:repeat(3,1fr);place-items:center;padding:8px;box-shadow:0 5px 0 rgba(0,0,0,.25)}
.die i{width:11px;height:11px;border-radius:50%;background:transparent}
.die i.on{background:var(--bg)}
.die.roll{animation:shake .45s ease}
@keyframes shake{25%{transform:rotate(-14deg) scale(1.06)}50%{transform:rotate(12deg) scale(.96)}75%{transform:rotate(-7deg)}}
.evt{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line)}
.evt:last-child{border-bottom:0}
.evt .e{font-size:19px;flex:0 0 auto}
.evt b{flex:1;font-size:13.5px;font-weight:700;line-height:1.35}
/* 銀行 */
.tier{padding:12px 13px;border-radius:var(--r-sm);background:var(--surface);border:2px solid var(--line);box-shadow:var(--shadow)}
.tier.best{border-color:var(--gold)}
.tier .hd{display:flex;align-items:center;gap:7px;margin-bottom:8px}
.tier .hd b{font-size:14px;font-weight:800}
.tier .hd span{font-size:11px;color:var(--muted);margin-left:auto;font-weight:650}
.tier .val{display:flex;align-items:baseline;gap:6px}
.tier .val b{font-size:22px;font-weight:850;letter-spacing:-.5px}
.tier .val u{text-decoration:none;font-size:11.5px;color:var(--muted)}
.tier .val i{font-style:normal;margin-left:auto;font-size:13px;font-weight:850;color:var(--good)}
.best-tag{font-size:9.5px;font-weight:850;color:#fff;background:var(--gold);padding:2px 7px;border-radius:999px}
.stepper{display:flex;align-items:center;gap:12px}
.stepper .sb{width:54px;height:54px;border-radius:14px;background:var(--surface2);border:1.5px solid var(--line);
  font-size:22px;font-weight:800;display:grid;place-items:center;flex:0 0 auto}
.dep{padding:12px 13px;border-bottom:1px solid var(--line)}
.dep:last-child{border-bottom:0}
.dep .r1{display:flex;align-items:center;gap:10px}
.dep .r1 .tx{flex:1;min-width:0}
.dep .r1 .tx b{display:block;font-size:14px;font-weight:750}
.dep .r1 .tx u{text-decoration:none;font-size:11px;color:var(--muted);display:block;margin-top:3px}
.dep .pg{height:9px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:10px}
.dep .pg i{display:block;height:100%;background:var(--pinkbar,var(--brand));border-radius:99px}
/* 券與額度 */
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{flex:1;padding:9px 6px;border-radius:11px;border:1.5px solid var(--line);background:var(--surface);
  font-size:13px;font-weight:750;color:var(--muted);min-height:42px}
.tabs button.on{background:var(--brand);border-color:transparent;color:#fff;box-shadow:0 3px 12px color-mix(in srgb,var(--brand) 40%,transparent)}
.tabs button b{font-weight:850}
.bud{padding:12px 13px;border-radius:var(--r-sm);background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.bud .top{display:flex;align-items:baseline;gap:7px;margin-bottom:9px}
.bud .top b{font-size:19px;font-weight:850;letter-spacing:-.5px;color:var(--good)}
.bud .top u{text-decoration:none;font-size:11.5px;color:var(--muted);font-weight:650}
.bud .bar{height:9px;border-radius:99px;background:var(--line);overflow:hidden}
.bud .bar i{display:block;height:100%;background:var(--gold);border-radius:99px}
.bud .lg{font-size:11px;color:var(--muted);margin-top:7px;font-weight:600}
.cpn{display:flex;align-items:center;gap:11px;padding:12px 13px;border-bottom:1px solid var(--line)}
.cpn:last-child{border-bottom:0}
.cpn .ic{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;font-size:19px;flex:0 0 auto;background:var(--surface2)}
.cpn .tx{flex:1;min-width:0}
.cpn .tx b{display:block;font-size:14px;font-weight:750;line-height:1.3}
.cpn .tx u{text-decoration:none;font-size:11px;color:var(--muted);display:block;margin-top:3px}
.cpn.done{opacity:.5}
.cpn.done .tx b{text-decoration:line-through}
.badge{font-size:10.5px;font-weight:800;padding:3px 8px;border-radius:999px;white-space:nowrap;flex:0 0 auto}
.badge.ok{background:var(--good-soft);color:var(--good)}
.badge.wait{background:var(--gold-soft);color:var(--gold)}
.badge.gray{background:var(--surface2);color:var(--muted)}
/* 日常任務 */
.rt{padding:11px 12px;border-bottom:1px solid var(--line)}
.rt:last-child{border-bottom:0}
.rthead{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.rthead .nm{font-weight:800;font-size:14px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.flame{font-size:11px;font-weight:850;color:var(--gold);background:var(--gold-soft);padding:3px 8px;border-radius:999px;white-space:nowrap}
.dicep{font-size:11px;font-weight:850;color:var(--brand);background:var(--brand-soft);padding:3px 8px;border-radius:999px;white-space:nowrap}
.rtn{font-size:11.5px;color:var(--muted);font-weight:800}
.rtrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:7px}
.rtc{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:6px;
  padding:9px 10px 10px;border-radius:12px;border:1.5px solid var(--line);
  background:var(--surface2);min-height:70px;text-align:left}
.rtc:active{transform:scale(.96)}
.rtc .ck{position:absolute;top:8px;right:8px;width:19px;height:19px;border-radius:6px;
  border:2px solid var(--line);display:grid;place-items:center;font-size:11px;color:transparent;font-weight:900}
.rtc .e{font-size:19px;line-height:1}

/* ---------------- 分數計算 ---------------- */
const BU=()=>Math.max(2,S.settings.bigUnit|0||5);
const toSmall=(unit,amount)=>unit==='big'?amount*BU():amount;
const live=arr=>arr.filter(x=>!x.deleted);
function ledgerOf(kidId){return S.ledger.filter(e=>e.kidId===kidId&&!e.voided)}
const ARC=()=>(S.settings.archive||(S.settings.archive={ts:0,bal:{},earn:{},dice:{},used:{}}));
const arcOf=(box,kidId)=>((ARC()[box]||{})[kidId]|0);
function balanceOf(kidId){let b=arcOf('bal',kidId);for(const e of S.ledger)if(e.kidId===kidId&&!e.voided)b+=e.small;return b}
function earnedOf(kidId){let b=arcOf('earn',kidId);for(const e of S.ledger)if(e.kidId===kidId&&!e.voided&&e.small>0)b+=e.small;return b}
function sinceOf(kidId,ts){let g=0,l=0,r=0;for(const e of S.ledger){if(e.kidId!==kidId||e.voided||e.ts<ts)continue;
  if(e.small>0)g+=e.small;else if(e.type==='redeem')r-=e.small;else l-=e.small}return{g,l,r}}
function splitScore(small){const bu=BU(),neg=small<0,a=Math.abs(small);return{neg,big:Math.floor(a/bu),small:a%bu}}
function fmtScore(small){const s=splitScore(small);const p=[];if(s.big)p.push(s.big+' 大分');if(s.small||!s.big)p.push(s.small+' 小分');return(s.neg?'−':'')+p.join(' ')}
function fmtCost(unit,amount){return amount+(unit==='big'?' 大分':' 小分')}
function kid(id){return S.kids.find(k=>k.id===id)}
function startOfDay(d){const x=new Date(d||now());x.setHours(0,0,0,0);return x.getTime()}
function startOfWeek(){const x=new Date();const d=(x.getDay()+6)%7;x.setDate(x.getDate()-d);x.setHours(0,0,0,0);return x.getTime()}
function mediaUrl(key){return key&&M.items[key]||null}
const NTD=()=>Math.max(1,S.settings.ntdPerSmall|0||10);
function valueOf(w){return w.price!=null?w.price:toSmall(w.unit,w.amount)*NTD()}
function priceTag(w){return w.price!=null?'NT$'+w.price:'特權'}
function rarity(costSmall){return costSmall<5?1:costSmall<15?2:costSmall<30?3:costSmall<50?4:5}
function stars(n){return '<span class="rarity">'+'★'.repeat(n)+'</span>'}

/* ---------------- 每週實體獎勵額度 ---------------- */
const WEEKMS=7*86400000;
const weeklyNTD=()=>Math.max(0,S.settings.weeklyBudgetNTD|0);
function budgetStartTs(){if(!S.settings.budgetStartTs)S.settings.budgetStartTs=startOfWeek();return S.settings.budgetStartTs}
function budgetWeeks(){return Math.floor((now()-budgetStartTs())/WEEKMS)+1}
function budgetAllowance(){return budgetWeeks()*weeklyNTD()}
function budgetUsed(kidId){let n=0;for(const c of S.coupons)if(!c.voided&&c.kidId===kidId)n+=c.priceNTD||0;return n}
// 銀行利息額外加額度（第三階段會用到）
function budgetBonus(kidId){let n=0;for(const e of S.ledger)
  if(!e.voided&&e.kidId===kidId&&e.type==='bank-out')n+=(e.interest||0)*NTD();return n}
function budgetAvail(kidId){return Math.max(0,budgetAllowance()+budgetBonus(kidId)-budgetUsed(kidId))}
function usedThisWeek(kidId){const w=startOfWeek();let n=0;
  for(const c of S.coupons)if(!c.voided&&c.kidId===kidId&&c.ts>=w)n+=c.priceNTD||0;return n}

/* ---------------- 券 ---------------- */
const isItemReward=w=>w.price!=null&&w.price>0;
function couponsOf(kidId,state){
  return S.coupons.filter(c=>!c.voided&&(!kidId||c.kidId===kidId)&&(
    state==='open'?(!c.usedTs&&!c.doneTs&&c.kind!=='item'):
    state==='wait'?(c.kind==='item'&&!c.doneTs):
    state==='done'?(c.usedTs||c.doneTs):true)).sort((a,b)=>b.ts-a.ts);
}
function issueCoupon(kidId,o){
  const c=Object.assign({id:uid('c'),kidId,ts:now(),usedTs:null,doneTs:null,voided:false,
    kind:'privilege',source:'manual',priceNTD:0,emoji:'🎫',updatedAt:now()},o);
  S.coupons.push(c);
  if(S.coupons.length>600)S.coupons=S.coupons.slice(-600);
  return c;
}
function useCoupon(id){

  if(c.kind==='item'){c.doneTs=now()}else{c.usedTs=now()}

}

  const go=()=>{
    c.voided=true;touch(c);
    if(c.ledgerId){const e=S.ledger.find(x=>x.id===c.ledgerId);if(e&&!e.voided){e.voided=true;touch(e)}}
    closeSheet();save();toast('已取消，分數退回');
  };
  (pinSet()&&!unlocked())?askPin('取消兌換需要家長密碼',go):go();
}

/* ---------------- 大富翁 ---------------- */
const TN=20;
const lapBonus=()=>Math.max(0,S.settings.lapBonus|0);
const chainCap=()=>Math.max(1,S.settings.chainCap|0||3);
function gp(kidId){
  if(!S.game.players[kidId])S.game.players[kidId]={pos:0,laps:0,rollsUsed:0,pause:0,updatedAt:now()};
  const p=S.game.players[kidId];
  if(p.pos==null)p.pos=0; if(p.laps==null)p.laps=0; if(p.rollsUsed==null)p.rollsUsed=0; if(p.pause==null)p.pause=0;
  return p;
}
function tileAt(i){return S.game.tiles[((i%TN)+TN)%TN]}
function gLog(ev,list){list.push(ev)}
function gPts(kidId,small,label,emoji,list){
  let d=small;
  if(small<0&&!S.settings.allowNegative){const bal=balanceOf(kidId);d=-Math.min(Math.abs(small),Math.max(0,bal))}
  if(d)commit({kidId,small:d,label,type:'game',emoji});
  gLog({emoji,label,delta:d},list);
}
function gCoupon(kidId,name,list,noCoupon){
  if(noCoupon){gLog({emoji:'🚫',label:'這回合不能領券：'+name,delta:0},list);return}
  const shield=/護盾/.test(name);
  issueCoupon(kidId,{name,emoji:shield?'🛡️':'🎫',kind:shield?'shield':'privilege',source:'tile'});
  gLog({emoji:shield?'🛡️':'🎫',label:'獲得「'+name+'」',delta:0,coupon:true},list);
}
function shieldsOf(kidId){return S.coupons.filter(c=>!c.voided&&!c.usedTs&&c.kidId===kidId&&c.kind==='shield')}
/* 只要是壞事（扣分 / 倒退 / 暫停），先看看有沒有護盾券，有就先問要不要用 */
function offerShield(kidId,ctx,bad){
  if(ctx.pendingBad)return false;                     // 一次骰子只擋一件事
  const sh=shieldsOf(kidId);
  if(!sh.length)return false;
  ctx.pendingBad=Object.assign({shieldId:sh[0].id},bad);
  gLog({emoji:'🛡️',label:'有護盾！可以擋掉「'+bad.label+'」',delta:0},ctx.log);
  return true;
}
function applyBad(kidId,bad,ctx){
  switch(bad.kind){
    case 'trap': gPts(kidId,-(bad.value||1),bad.label,'💥',ctx.log); break;
    case 'back':
      if(ctx.chain<chainCap()){ctx.chain++;
        gLog({emoji:'⏪',label:'倒退 '+(bad.value||2)+' 格',delta:0},ctx.log);
        return step(kidId,-(bad.value||2),ctx)}
      gLog({emoji:'⏪',label:'倒退（連鎖上限，這次跳過）',delta:0},ctx.log); break;
    case 'pause': {const p=gp(kidId);p.pause=(p.pause||0)+1;touch(p);
      gLog({emoji:'⏸',label:'下次骰子暫停一輪',delta:0},ctx.log); break}
  }
}
function pick(a){return a[Math.floor(Math.random()*a.length)]}

function landOn(kidId,idx,ctx){
  const t=tileAt(idx),p=gp(kidId),L=ctx.log;
  switch(t.type){
    case 'start': gLog({emoji:'🏁',label:'回到起點',delta:0},L); break;
    case 'point': gPts(kidId,t.value||1,'棋盤 '+t.label,'⭐',L); break;
    case 'treasure': gPts(kidId,t.value||2,'踩到寶箱','💎',L); break;
    case 'trap': {
      const bad={kind:'trap',value:t.value||1,label:'踩到陷阱'};
      if(!offerShield(kidId,ctx,bad))applyBad(kidId,bad,ctx);
      break;
    }
    case 'coupon': gCoupon(kidId,t.reward||'神秘券',L,ctx.noCoupon); break;
    case 'lucky': gCoupon(kidId,pick(S.game.cards.lucky),L,ctx.noCoupon); break;
    case 'shield': gCoupon(kidId,'免扣分護盾券',L,ctx.noCoupon); break;
    case 'reroll': if(ctx.chain<chainCap()){ctx.chain++;ctx.reroll=true;
        gLog({emoji:'🔁',label:'再骰一次（不扣骰子）',delta:0},L)}
      else gLog({emoji:'🔁',label:'再骰（連鎖上限，這次跳過）',delta:0},L); break;
    case 'move': if(ctx.chain<chainCap()){ctx.chain++;
        gLog({emoji:'⏩',label:'前進 '+(t.value||3)+' 格',delta:0},L);
        return step(kidId,t.value||3,ctx)}
      else gLog({emoji:'⏩',label:'前進（連鎖上限，這次跳過）',delta:0},L); break;
    case 'back': {
      const bad={kind:'back',value:t.value||2,label:'倒退 '+(t.value||2)+' 格'};
      if(!offerShield(kidId,ctx,bad))return applyBad(kidId,bad,ctx);
      break;
    }
    case 'chance': {
      const c=pick(S.game.cards.chance);
      gLog({emoji:'❓',label:'機會：'+c.label,delta:0,card:'chance'},L);
      return applyCard(kidId,c,ctx);
    }
    case 'fate': {
      const c=pick(S.game.cards.fate);
      gLog({emoji:'😈',label:'命運：'+c.label,delta:0,card:'fate'},L);
      return applyCard(kidId,c,ctx);
    }
  }
}
function applyCard(kidId,c,ctx){
  const L=ctx.log,p=gp(kidId);
  switch(c.t){
    case 'reroll': if(ctx.chain<chainCap()){ctx.chain++;ctx.reroll=true} break;
    case 'point': gPts(kidId,c.v||1,'機會卡','❓',L); break;
    case 'shield': gCoupon(kidId,'免扣分護盾券',L,ctx.noCoupon); break;
    case 'coupon': gCoupon(kidId,c.v,L,ctx.noCoupon); break;
    case 'goto': if(ctx.chain<chainCap()){ctx.chain++;
        const diff=(((c.v-p.pos)%TN)+TN)%TN; return step(kidId,diff||TN,ctx)} break;
    case 'swap': {
      const others=live(S.kids).filter(k=>k.id!==kidId);
      if(others.length){const o=others[0],op=gp(o.id),tmp=p.pos;p.pos=op.pos;op.pos=tmp;
        touch(op);gLog({emoji:'🔄',label:'跟 '+o.name+' 交換位置',delta:0},L);
        if(ctx.chain<chainCap()){ctx.chain++;return landOn(kidId,p.pos,ctx)}}
      break;
    }
    case 'task': ctx.task={label:c.label,value:c.v||1}; break;
    case 'back': {
      const bad={kind:'back',value:c.v||2,label:'退後 '+(c.v||2)+' 格'};
      if(!offerShield(kidId,ctx,bad))return applyBad(kidId,bad,ctx);
      break;
    }
    case 'pause': {
      const bad={kind:'pause',label:'暫停一次骰子'};
      if(!offerShield(kidId,ctx,bad))applyBad(kidId,bad,ctx);
      break;
    }
    case 'nocoupon': ctx.noCoupon=true; break;
  }
}
function step(kidId,steps,ctx){
  const p=gp(kidId),old=p.pos;
  let np=old+steps;
  if(steps>0&&np>=TN){                       // 通過起點 = 完成一圈
    const laps=Math.floor(np/TN);
    p.laps+=laps;
    if(lapBonus()>0)gPts(kidId,lapBonus()*laps,'繞完一圈','🏁',ctx.log);
  }
  p.pos=((np%TN)+TN)%TN; touch(p);
  return landOn(kidId,p.pos,ctx);
}
function rollDice(kidId){
  const k=kid(kidId);if(!k)return;
  if(diceOf(kidId)<=0){toast('骰子用完了，先去完成今天的任務');buzz(120);return}
  const p=gp(kidId);
  if(p.pause>0){p.pause--;p.rollsUsed++;touch(p);S.game.updatedAt=now();save();
    toast('⏸ 這次暫停一輪，骰子扣掉了');return}
  const d=1+Math.floor(Math.random()*6);
  p.rollsUsed++;touch(p);
  const ctx={log:[],chain:0,reroll:false,noCoupon:false,task:null,pendingBad:null};
  step(kidId,d,ctx);
  S.game.updatedAt=now();
  buzz(35);beep(ctx.log.some(e=>e.delta<0)?'bad':'good');
  save();
  rollResult(kidId,d,ctx);
}
const DAYMS=86400000;
const plans=()=>S.settings.plans||[];
const capInt=()=>Math.max(0,S.settings.interestCap|0);
function interestFor(amount,days){
  const pl=plans().find(x=>x.days===days);if(!pl)return 0;
  return Math.min(Math.floor(amount/10)*(pl.per10||0),capInt());   // 每滿 10 小分，零頭不計息；上限封頂
}
function liveSavings(kidId){return S.savings.filter(s=>!s.voided&&!s.claimedTs&&(!kidId||s.kidId===kidId))}
function bankedOf(kidId){let n=0;for(const s of liveSavings(kidId))n+=s.amount;return n}
function dueTs(s){return s.startTs+s.days*DAYMS}
function isMature(s){return now()>=dueTs(s)}
function daysLeft(s){return Math.max(0,Math.ceil((dueTs(s)-now())/DAYMS))}
function matureCount(kidId){return liveSavings(kidId).filter(isMature).length}
function deposit(kidId,amount,days){
  amount=Math.floor(amount)||0;
  if(amount<=0){toast('要存的分數要大於 0');return}
  if(amount>balanceOf(kidId)){toast('分數不夠，目前只有 '+balanceOf(kidId)+' 小分');buzz(120);return}
  if(!plans().some(x=>x.days===days)){toast('沒有這個期別');return}
  const e=commit({kidId,small:-amount,label:'存入銀行 '+amount+' 小分（'+days+' 天）',type:'bank-in',emoji:'🏦'});
  const sv={id:uid('s'),kidId,amount,days,startTs:now(),claimedTs:null,broke:false,
            ledgerId:e.id,voided:false,updatedAt:now()};
  S.savings.push(sv);
  if(S.savings.length>400)S.savings=S.savings.slice(-400);
  closeSheet();buzz(40);beep('good');save();
  toast('🏦 存了 '+amount+' 小分，'+days+' 天後可以領 '+(amount+interestFor(amount,days))+' 小分');
}
function topUp(savingId,amount){
  const sv=S.savings.find(x=>x.id===savingId);
  if(!sv||sv.claimedTs||sv.voided)return;
  amount=Math.floor(amount)||0;
  if(amount<=0){toast('要加存的分數要大於 0');return}
  const bal=balanceOf(sv.kidId);
  if(amount>bal){toast('分數不夠，目前只有 '+bal+' 小分');buzz(120);return}
  const before=interestFor(sv.amount,sv.days);
  const e=commit({kidId:sv.kidId,small:-amount,label:'加存 '+amount+' 小分（'+sv.days+' 天期）',type:'bank-in',emoji:'🏦'});
  sv.amount+=amount;
  sv.addIds=(sv.addIds||[]).concat([e.id]);
  touch(sv);
  const after=interestFor(sv.amount,sv.days);
  closeSheet();buzz(40);beep(after>before?'big':'good');save();
  toast('🏦 加存 '+amount+' 小分　到期可領 '+(sv.amount+after)+'（利息 +'+after+'）');
}
function claimSaving(id){
  const sv=S.savings.find(x=>x.id===id);
  if(!sv||sv.claimedTs||sv.voided)return;
  if(!isMature(sv)){toast('還沒到期，還要 '+daysLeft(sv)+' 天');buzz(120);return}
  const it=interestFor(sv.amount,sv.days);
  commit({kidId:sv.kidId,small:sv.amount+it,interest:it,type:'bank-out',emoji:'🏦',
          label:'領回存款 '+sv.amount+' 小分'+(it?'（利息 +'+it+'）':'')});
  sv.claimedTs=now();touch(sv);
  closeSheet();buzz(50);beep('big');save();
  toast('🎉 領回 '+(sv.amount+it)+' 小分'+(it?'　利息 +'+it+'，額度也加 NT$'+(it*NTD()):''));
}
function breakSaving(id){
  const sv=S.savings.find(x=>x.id===id);
  if(!sv||sv.claimedTs||sv.voided)return;
  const go=()=>{
    commit({kidId:sv.kidId,small:sv.amount,interest:0,type:'bank-out',emoji:'🏦',
            label:'提早解約，退回本金 '+sv.amount+' 小分'});
    sv.claimedTs=now();sv.broke=true;touch(sv);
    closeSheet();save();toast('已解約，本金退回（沒有利息）');
  };
  (pinSet()&&!unlocked())?askPin('提早解約需要家長密碼',go):go();
}

/* ---------------- 日常任務 ---------------- */
function dayKey(ts){const d=new Date(ts||now());
  return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
function routinesFor(kidId){const k=kid(kidId);if(!k)return [];
  return live(S.routines).filter(r=>!r.kidIds||!r.kidIds.length||r.kidIds.includes(kidId))}
function routineDone(kidId,routineId,day){day=day||dayKey();
  return S.routineLog.some(e=>!e.voided&&e.kidId===kidId&&e.routineId===routineId&&e.day===day)}
function doneCount(kidId,day){return routinesFor(kidId).filter(r=>routineDone(kidId,r.id,day)).length}
function allDone(kidId,day){const rs=routinesFor(kidId);
  return rs.length>0&&rs.every(r=>routineDone(kidId,r.id,day))}
function streakOf(kidId){
  const d=new Date();let n=0;
  if(!allDone(kidId,dayKey(d)))d.setDate(d.getDate()-1);
  while(allDone(kidId,dayKey(d))){n++;d.setDate(d.getDate()-1);if(n>400)break}
  return n;
}
function diceOf(kidId){
  let rd=0;const days=new Set();
  for(const e of S.routineLog){if(e.voided||e.kidId!==kidId)continue;
    const r=S.routines.find(x=>x.id===e.routineId);rd+=(r&&r.dice)||1;days.add(e.day)}
  for(const d of days)if(allDone(kidId,d))rd+=1;          // 當天全完成再送 1 顆
  const per=Math.max(1,S.settings.dicePerPoints|0||5);
  const used=(S.game&&S.game.players&&S.game.players[kidId]&&S.game.players[kidId].rollsUsed)||0;
  return Math.max(0,rd+Math.floor(earnedOf(kidId)/per)-used);
}
function awardRoutineDay(kidId,day){
  const st=S.settings,k=kid(kidId);if(!k)return;
  const got=[];
  if(st.routineAllBonus>0){commit({kidId,small:st.routineAllBonus,label:'今天任務全完成',type:'routine',day,emoji:'✅'});got.push('+'+st.routineAllBonus)}
  const s=streakOf(kidId);
  if(s===3&&st.streak3Bonus>0){commit({kidId,small:st.streak3Bonus,label:'連續 3 天全勤',type:'routine',day,emoji:'🔥'});got.push('連續3天 +'+st.streak3Bonus)}
  if(s>0&&s%7===0&&st.streak7Bonus>0){commit({kidId,small:st.streak7Bonus,label:'連續 '+s+' 天全勤',type:'routine',day,emoji:'🏆'});got.push('連續'+s+'天 +'+st.streak7Bonus)}
  return {streak:s,got};
}

       if(S.routineLog.length>800)S.routineLog=S.routineLog.slice(-800)}

  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const seq=kind==='bad'?[[440,0],[300,.1]]:kind==='big'?[[660,0],[880,.09],[1175,.18]]:[[784,0],[1047,.08]];
    for(const[f,d]of seq){
      const o=AC.createOscillator(),g=AC.createGain();
      o.type='triangle';o.frequency.value=f;o.connect(g);g.connect(AC.destination);
      const t=AC.currentTime+d;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.16,t+.012);
      g.gain.exponentialRampToValueAtTime(.0005,t+.2);o.start(t);o.stop(t+.22);
    }

}

/* ============================================================
   GitHub 同步：repo 內的 data.json / media.json
   Token 只存在這支裝置的 localStorage，不會寫進網頁或雲端
   ============================================================ */
function b64enc(str){
  const by=new TextEncoder().encode(str);let bin='';const C=0x8000;
  for(let i=0;i<by.length;i+=C)bin+=String.fromCharCode.apply(null,by.subarray(i,i+C));
  return btoa(bin);
}
function b64dec(b64){
  const bin=atob(String(b64).replace(/\s/g,''));const by=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)by[i]=bin.charCodeAt(i);
  return new TextDecoder().decode(by);
}
const ghReady=()=>!!(GH.owner&&GH.repo&&GH.token);
let syncState='idle', syncMsg='', pushTimer=null, pushing=false, needMedia=false;

function setSync(s,msg){syncState=s;syncMsg=msg||'';paintSync()}
function paintSync(){
  const d=$('#sdot'),t=$('#stxt');if(!d)return;
  d.className='dot';
  if(!ghReady()){d.classList.add('warn');t.textContent='僅存本機'}
  else if(syncState==='busy'){d.classList.add('busy');t.textContent='同步中'}
  else if(syncState==='err'){d.classList.add('err');t.textContent='同步失敗'}
  else if(dirty){d.classList.add('warn');t.textContent='待上傳'}
  else{d.classList.add('ok');t.textContent='已同步'}
}
async function gh(path,opts){
  // GitHub 的 GET 回 Cache-Control: private,max-age=60，瀏覽器會給舊的 sha → 寫入永遠 409
  // 所以一律 no-store，並加上時間戳避開快取
  const q=(opts&&opts.method)?'':('?ref='+encodeURIComponent(GH.branch||'main')+'&_t='+Date.now());
  const r=await fetch('https://api.github.com/repos/'+GH.owner+'/'+GH.repo+'/contents/'+path+q,
    Object.assign({cache:'no-store',headers:{'Authorization':'Bearer '+GH.token,'Accept':'application/vnd.github+json',
      'X-GitHub-Api-Version':'2022-11-28','If-None-Match':''}},opts||{}));
  return r;
}
async function ghRead(path){
  const r=await gh(path);
  if(r.status===404)return{missing:true};
  if(!r.ok)throw new Error('讀取失敗 '+r.status+' '+(await r.text()).slice(0,120));
  const j=await r.json();
  shaCache[path]=j.sha;LS.set(K_SHA,shaCache);
  let data=null;
  try{data=JSON.parse(b64dec(j.content))}catch(e){throw new Error('雲端檔案不是有效 JSON')}
  return{data,sha:j.sha};
}
async function ghWrite(path,obj,msg,remerge){
  // 衝突時「重新讀 → 重新合併 → 再寫」，只換 sha 會蓋掉別台剛寫的資料
  let sha=shaCache[path];
  if(!sha){const cur=await gh(path);if(cur.ok){const j=await cur.json();sha=j.sha}}
  const build=o=>{const b={message:msg||('update '+path),content:b64enc(JSON.stringify(o,null,1)),branch:GH.branch||'main'};
    if(sha)b.sha=sha;return b};
  let r=await gh(path,{method:'PUT',body:JSON.stringify(build(obj))});
  for(let i=0;i<3&&(r.status===409||r.status===422);i++){
    delete shaCache[path];LS.set(K_SHA,shaCache);
    const rem=await ghRead(path).catch(()=>null);
    sha=shaCache[path];
    if(rem&&rem.data&&remerge)obj=remerge(rem.data);
    r=await gh(path,{method:'PUT',body:JSON.stringify(build(obj))});
  }
  if(!r.ok)throw new Error('寫入失敗 '+r.status+' '+(await r.text()).slice(0,140));
  const j=await r.json();
  shaCache[path]=j.content.sha;LS.set(K_SHA,shaCache);
}

/* ---- 合併：帳本取聯集，其他依 updatedAt 後寫贏 ---- */
const newer=(a,b)=>((a&&a.updatedAt)||0)>=((b&&b.updatedAt)||0)?a:b;
function mergeList(L,R){
  const m=new Map();
  for(const it of (R||[]))if(it&&it.id)m.set(it.id,it);
  for(const it of (L||[])){if(!it||!it.id)continue;const o=m.get(it.id);m.set(it.id,o?newer(it,o):it)}
  return [...m.values()].sort((a,b)=>(a.sort||0)-(b.sort||0));
}
function mergeLedger(L,R){
  const m=new Map();
  for(const e of (R||[]))if(e&&e.id)m.set(e.id,e);
  for(const e of (L||[])){if(!e||!e.id)continue;const o=m.get(e.id);m.set(e.id,o?newer(e,o):e)}
  return [...m.values()].sort((a,b)=>a.ts-b.ts).slice(-1200);
}
function mergeState(L,R){
  if(!R||!R.kids)return L;
  // 「清空紀錄」的時間點取兩邊最大值，不能跟著 settings 一起被後寫贏
  // （剛裝好的新手機 settings 時間最新，會把清空紀錄洗掉，舊紀錄就倒回來了）
  const st=Object.assign({},newer(L.settings,R.settings));
  const cut=Math.max((L.settings&&L.settings.ledgerClearedAt)||0,(R.settings&&R.settings.ledgerClearedAt)||0);
  if(cut)st.ledgerClearedAt=cut;
  // 歸檔（壓縮一年前的紀錄）同理：取 ts 較大的那份，否則底數會被洗掉、分數就跳掉了
  const la=(L.settings&&L.settings.archive)||{ts:0},ra=(R.settings&&R.settings.archive)||{ts:0};
  const arc=((la.ts|0)>=(ra.ts|0))?la:ra;
  if(arc&&(arc.ts|0)>0)st.archive=arc;
  const floor=Math.max(cut,(st.archive&&st.archive.ts)|0);
  let lg=mergeLedger(L.ledger,R.ledger);
  if(floor)lg=lg.filter(e=>((e.updatedAt||e.ts||0)>=floor));
  return{schema:Math.max(L.schema||1,R.schema||1),deviceId:L.deviceId,needsSeedRefresh:L.needsSeedRefresh,
    settings:st,
    kids:mergeList(L.kids,R.kids),
    rules:mergeList(L.rules,R.rules),
    rewards:mergeList(L.rewards,R.rewards),
    routines:mergeList(L.routines,R.routines),
    routineLog:mergeList(L.routineLog,R.routineLog).slice(-4000),
    coupons:mergeList(L.coupons,R.coupons).slice(-3000),
    savings:mergeList(L.savings,R.savings).slice(-800),
    game:mergeGame(L.game,R.game),
    ledger:lg};
}
function mergeGame(L,R){
  L=L||{players:{},tiles:defaultTiles(),cards:defaultCards()};
  if(!R)return L;
  const players={};
  for(const id of new Set([...Object.keys(L.players||{}),...Object.keys(R.players||{})])){
    const a=(L.players||{})[id],b=(R.players||{})[id];
    if(!a){players[id]=b;continue} if(!b){players[id]=a;continue}
    const nw=newer(a,b);
    players[id]=Object.assign({},nw,{rollsUsed:Math.max(a.rollsUsed||0,b.rollsUsed||0),
                                     laps:Math.max(a.laps||0,b.laps||0)});   // 已用骰子取大值，不會憑空多出
  }
  const nw=newer(L,R);
  return {updatedAt:Math.max(L.updatedAt||0,R.updatedAt||0),players,
          tiles:(nw.tiles&&nw.tiles.length===20)?nw.tiles:defaultTiles(),
          cards:nw.cards||defaultCards(),lastRoll:nw.lastRoll};
}
function mergeMedia(L,R){
  if(!R||!R.items)return L;
  const items=Object.assign({},R.items,L.items);
  return{updatedAt:Math.max(L.updatedAt||0,R.updatedAt||0),items};
}

function queuePush(media){
  if(media)needMedia=true;
  paintSync();
  if(!ghReady())return;
  clearTimeout(pushTimer);
  pushTimer=setTimeout(()=>push(),2200);
}
async function push(){
  if(!ghReady()||pushing)return;
  if(!navigator.onLine){setSync('idle');return}
  pushing=true;setSync('busy');
  try{
    const rem=await ghRead(GH.path||'data.json');
    if(rem.data){S=mergeState(S,rem.data);LS.set(K_STATE,S)}
    await ghWrite(GH.path||'data.json',S,'積分更新 '+new Date().toLocaleString('zh-TW'),
      rd=>{S=mergeState(S,rd);LS.set(K_STATE,S);return S});
    if(needMedia){
      const rm=await ghRead(GH.mediaPath||'media.json').catch(()=>({missing:true}));
      if(rm.data)M=mergeMedia(M,rm.data);
      M.updatedAt=now();LS.set(K_MEDIA,M);
      await ghWrite(GH.mediaPath||'media.json',M,'圖片更新',rd=>{M=mergeMedia(M,rd);LS.set(K_MEDIA,M);return M});
      needMedia=false;
    }
    dirty=false;LS.set(K_DIRTY,false);setSync('idle');render();
  }catch(e){
    setSync('err',e.message||String(e));
  }finally{pushing=false}
}
async function pull(quiet){
  if(!ghReady())return;
  setSync('busy');
  try{
    const rs=await ghRead(GH.path||'data.json');
    if(rs.data){S=mergeState(S,rs.data);LS.set(K_STATE,S)}
    const rm=await ghRead(GH.mediaPath||'media.json').catch(()=>({missing:true}));
    if(rm.data){M=mergeMedia(M,rm.data);LS.set(K_MEDIA,M)}
    setSync('idle');render();
    if(dirty)queuePush();
    if(!quiet)toast('已從 GitHub 取回最新資料');
  }catch(e){setSync('err',e.message||String(e));if(!quiet)toast('讀取失敗：'+(e.message||''))}
}
window.addEventListener('online',()=>{if(dirty)queuePush()});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&ghReady())pull(true)});

let pickCb=null;
$('#filepick').addEventListener('change',async e=>{

function pickImage(cb){pickCb=cb;$('#filepick').click()}
async function shrink(file,size,q){
  const bmp=await loadBitmap(file);
  const c=document.createElement('canvas');c.width=c.height=size;
  const ctx=c.getContext('2d');
  const s=Math.min(bmp.width,bmp.height);
  ctx.drawImage(bmp,(bmp.width-s)/2,(bmp.height-s)/2,s,s,0,0,size,size);
  if(bmp.close)bmp.close();
  let out=c.toDataURL('image/jpeg',q);
  if(out.length>180000)out=c.toDataURL('image/jpeg',.62);
  return out;
}
function loadBitmap(file){
  if(window.createImageBitmap)return createImageBitmap(file).catch(()=>viaImg(file));
  return viaImg(file);
}
function viaImg(file){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onload=()=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=fr.result};
    fr.onerror=rej;fr.readAsDataURL(file);
  });
}

/* ---------- 紀錄：積分折線圖 ---------- */
function dayStart(ts){const d=new Date(ts);d.setHours(0,0,0,0);return d.getTime()}
const CR={week:{n:7,step:1,label:'週'},month:{n:30,step:1,label:'月'},year:{n:53,step:7,label:'年'}};
function chartSeries(kidIds,range){
  const sp=CR[range]||CR.week, span=sp.step*DAYMS;
  const today=dayStart(now());
  const start=today-(sp.n-1)*span;
  return kidIds.map(id=>{
    let run=arcOf('bal',id);
    const buckets=new Array(sp.n).fill(0);
    for(const e of S.ledger){
      if(e.voided||e.kidId!==id)continue;
      const b=Math.floor((dayStart(e.ts)-start)/span);
      if(b<0)run+=e.small;
      else if(b<sp.n)buckets[b]+=e.small;
    }
    const pts=[];let cur=run;
    for(let i=0;i<sp.n;i++){cur+=buckets[i];pts.push({ts:start+i*span,gain:buckets[i],bal:cur})}
    return {id,pts};
  });
}
function chartBox(kidIds){
  const sp=CR[chartRange]||CR.week;
  const ser=chartSeries(kidIds,chartRange);
  const n=sp.n;
  if(!ser.length)return '';
  let hi=0,lo=0;
  for(const s2 of ser)for(const q of s2.pts){if(q.bal>hi)hi=q.bal;if(q.bal<lo)lo=q.bal}
  if(hi-lo<5)hi=lo+5;
  const W=340,H=132,PL=26,PR=58,PT=12,PB=20;
  const iw=W-PL-PR, ih=H-PT-PB;
  const X=i=>PL+(n<=1?iw/2:i*iw/(n-1));
  const Y=v=>PT+ih-((v-lo)/(hi-lo))*ih;
  let g='';
  for(let q=0;q<=2;q++){
    const v=lo+(hi-lo)*q/2, y=Y(v);
    g+='<line x1="'+PL+'" y1="'+y.toFixed(1)+'" x2="'+(PL+iw)+'" y2="'+y.toFixed(1)+'" class="gl"/>'+
       '<text x="'+(PL-5)+'" y="'+(y+3.5).toFixed(1)+'" class="gt" text-anchor="end">'+Math.round(v)+'</text>';
  }
  let paths='',dots='';
  ser.forEach(s2=>{
    const k=kid(s2.id);if(!k)return;
    const d=s2.pts.map((q,i)=>X(i).toFixed(1)+','+Y(q.bal).toFixed(1)).join(' ');
    if(ser.length===1)
      paths+='<polygon points="'+X(0).toFixed(1)+','+(PT+ih)+' '+d+' '+X(n-1).toFixed(1)+','+(PT+ih)+'" fill="'+k.color+'" opacity=".10"/>';
    paths+='<polyline points="'+d+'" fill="none" stroke="'+k.color+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
    const last=s2.pts[n-1];
    dots+='<circle cx="'+X(n-1).toFixed(1)+'" cy="'+Y(last.bal).toFixed(1)+'" r="4" fill="'+k.color+'" stroke="var(--surface)" stroke-width="2"/>';
  });
  // 直接標示：名字用文字色、旁邊的色點負責辨識（不靠顏色分辨）；兩條線太近時把標籤錯開
  const ends=ser.map(s2=>({k:kid(s2.id),v:s2.pts[n-1].bal,y:Y(s2.pts[n-1].bal)}))
                .filter(o=>o.k).sort((a,b)=>a.y-b.y);
  for(let i=1;i<ends.length;i++)if(ends[i].y-ends[i-1].y<11)ends[i].y=ends[i-1].y+11;
  let labs='';
  for(const o of ends){
    const y=clamp(o.y,PT+5,PT+ih);
    labs+='<circle cx="'+(PL+iw+9)+'" cy="'+(y-2.5).toFixed(1)+'" r="3" fill="'+o.k.color+'"/>'+
      '<text x="'+(PL+iw+15)+'" y="'+(y+1).toFixed(1)+'" class="lb">'+esc(o.k.name.slice(0,5))+'</text>'+
      '<text x="'+(PL+iw+15)+'" y="'+(y+11).toFixed(1)+'" class="lv">'+o.v+'</text>';
  }
  // 可點的透明區塊：點一下看那天的數字
  let hit='';
  for(let i=0;i<n;i++){
    const w=iw/n;
    hit+='<rect x="'+(PL+i*w-w/2).toFixed(1)+'" y="'+PT+'" width="'+w.toFixed(1)+'" height="'+ih+'" fill="transparent" data-act="cpick" data-i="'+i+'"/>';
  }
  let cross='';
  if(chartPick!=null&&chartPick>=0&&chartPick<n){
    const x=X(chartPick);
    cross='<line x1="'+x.toFixed(1)+'" y1="'+PT+'" x2="'+x.toFixed(1)+'" y2="'+(PT+ih)+'" class="cl"/>';
    ser.forEach(s2=>{const k=kid(s2.id);if(!k)return;
      cross+='<circle cx="'+x.toFixed(1)+'" cy="'+Y(s2.pts[chartPick].bal).toFixed(1)+'" r="4.5" fill="'+k.color+'" stroke="var(--surface)" stroke-width="2"/>';});
  }
  const fd=ts=>new Date(ts).toLocaleDateString('zh-TW',{month:'numeric',day:'numeric'});
  const svg='<svg class="chart" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid meet">'+g+paths+dots+labs+cross+hit+
    '<text x="'+PL+'" y="'+(H-5)+'" class="gt" text-anchor="start">'+fd(ser[0].pts[0].ts)+'</text>'+
    '<text x="'+(PL+iw)+'" y="'+(H-5)+'" class="gt" text-anchor="end">'+fd(ser[0].pts[n-1].ts)+'</text></svg>';

  let tip='';
  if(chartPick!=null&&chartPick>=0&&chartPick<n){
    const t0=ser[0].pts[chartPick].ts;
    tip='<div class="ctip"><b>'+fd(t0)+(sp.step>1?'－'+fd(t0+(sp.step-1)*DAYMS):'')+'</b>'+
      ser.map(s2=>{const k=kid(s2.id);if(!k)return '';const q=s2.pts[chartPick];
        return '<span><i style="background:'+k.color+'"></i>'+esc(k.name)+' <b>'+q.bal+'</b>'+
          (q.gain?'<u class="'+(q.gain>0?'p':'n')+'">'+(q.gain>0?'+':'−')+Math.abs(q.gain)+'</u>':'')+'</span>'}).join('')+'</div>';
  }
  const tabs='<div class="crg">'+Object.keys(CR).map(r=>
    '<button class="'+(chartRange===r?'on':'')+'" data-act="crange" data-v="'+r+'">'+CR[r].label+'</button>').join('')+'</div>';
  return '<div class="sec"><h2>分數走勢</h2></div><div class="card chartcard">'+tabs+svg+tip+
    '<div class="chint">線是<b>累積的小分</b>（扣分會往下）。點一下圖看那天的數字。</div></div>';
}

function logRow(e,allowTap){
  const k=kid(e.kidId),p=e.small>0;
  const ic=e.type==='redeem'?'🎁':e.type==='adjust'?'✎':(e.emoji||(p?'➕':'➖'));
  const d=new Date(e.ts);
  const tm=('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);
  return '<button class="li '+(e.voided?'void':'')+'" '+(allowTap?'data-act="entry" data-id="'+e.id+'"':'')+'>'+
    '<div class="ic">'+esc(ic)+'</div><div class="tx"><b>'+esc(e.label||'調整')+'</b>'+
    '<u>'+tm+' ・ '+esc(k?k.name:'已刪除')+(e.voided?' ・ 已撤銷':'')+'</u></div>'+
    '<span class="delta '+(p?'p':'n')+'">'+(p?'+':'−')+fmtScore(Math.abs(e.small))+'</span></button>';
}
function archiveCut(){return dayStart(now()-365*DAYMS)}
function oldCount(){const c=archiveCut();return S.ledger.filter(e=>e.ts<c).length}
function compactOld(){
  const c=archiveCut(),old=S.ledger.filter(e=>e.ts<c);
  if(!old.length){toast('一年內的紀錄都還在，不用壓縮');return}
  const a=ARC();
  const arc={ts:c,bal:Object.assign({},a.bal||{}),earn:Object.assign({},a.earn||{})};
  for(const e of old){
    if(e.voided)continue;
    arc.bal[e.kidId]=(arc.bal[e.kidId]|0)+e.small;
    if(e.small>0)arc.earn[e.kidId]=(arc.earn[e.kidId]|0)+e.small;
  }
  S.settings.archive=arc;S.settings.updatedAt=now();
  S.ledger=S.ledger.filter(e=>e.ts>=c);
  S.routineLog=S.routineLog.filter(e=>(e.ts||0)>=c||!e.ts);
  S.coupons=S.coupons.filter(x=>(x.ts||0)>=c);
  S.savings=S.savings.filter(x=>!x.claimedTs||x.claimedTs>=c);
  closeSheet();save();
  toast('📦 已壓縮 '+old.length+' 筆一年前的紀錄，分數沒有變');
}
function vLog(){
  const ks=live(S.kids);
  let h='<div class="chips"><button class="chip plain '+(!selKid?'on':'')+'" data-act="sel" data-id="">全部</button>';
  for(const x of ks)h+='<button class="chip '+(x.id===selKid?'on':'')+'" style="--kc:'+x.color+'" data-act="sel" data-id="'+x.id+'">'+avatarHTML(x)+esc(x.name)+'</button>';
  h+='</div>';
  const tgt=selKid?[kid(selKid)].filter(Boolean):ks;
  const week=startOfWeek(),month=new Date();month.setDate(1);month.setHours(0,0,0,0);
  let wg=0,mg=0,bal=0;
  for(const k of tgt){wg+=sinceOf(k.id,week).g;mg+=sinceOf(k.id,month.getTime()).g;bal+=balanceOf(k.id)}
  h+='<div class="stats" style="margin-top:12px"><div class="st"><b>'+bal+'</b><u>可用小分</u></div>'+
     '<div class="st"><b style="color:var(--good)">+'+wg+'</b><u>本週獲得</u></div>'+
     '<div class="st"><b style="color:var(--brand)">+'+mg+'</b><u>本月獲得</u></div></div>';
  if(tgt.length)h+=chartBox(tgt.map(k=>k.id));
  const es=S.ledger.filter(e=>!selKid||e.kidId===selKid).slice().reverse();
  if(!es.length)return h+'<div class="empty"><span class="e">🧾</span>還沒有任何紀錄</div>';
  let last='';
  for(const e of es.slice(0,200)){
    const day=new Date(e.ts).toLocaleDateString('zh-TW',{month:'numeric',day:'numeric',weekday:'short'});
    if(day!==last){if(last)h+='</div>';h+='<div class="daylab">'+day+'</div><div class="list">';last=day}
    h+=logRow(e,true);
  }
  return h+'</div><div style="height:20px"></div>';
}

function applyRule(ruleId,ask){
  const r=S.rules.find(x=>x.id===ruleId);if(!r)return;
  const ks=live(S.kids);
  if(!ks.length){toast('請先新增小孩');return}
  if(ask&&ks.length>1)return pickKidSheet(r);
  if(!ks.some(k=>k.id===selKid))selKid=ks[0].id;
  addPoints(selKid,r.kind==='deduct'?-toSmall(r.unit,r.amount):toSmall(r.unit,r.amount),r.label,{ruleId:r.id,emoji:r.emoji,type:r.kind});
}
function pickKidSheet(r){
  const dd=r.kind==='deduct';
  sheet(esc(r.emoji||'')+' '+esc(r.label),
    '<div class="f hint" style="margin-top:-8px;font-size:13.5px">'+
      '<b style="color:var(--'+(dd?'bad':'good')+');font-size:15px">'+(dd?'−':'+')+fmtCost(r.unit,r.amount)+'</b>　要記給誰？</div>'+

      '<div class="sub">目前 '+fmtScore(balanceOf(k.id))+'</div></div></div></div></button>').join('')+'</div>'+
    '<button class="btn wide ghost" style="margin-top:12px" data-act="close">取消</button>');
}
function addPoints(kidId,small,label,extra){
  const k=kid(kidId);if(!k||!small)return;
  let delta=small;
  if(small<0&&!S.settings.allowNegative){
    const bal=balanceOf(kidId);
    delta=-Math.min(Math.abs(small),Math.max(0,bal));
    if(delta===0){toast(k.name+' 已經是 0 分，不再扣分');buzz(90);return}
  }
  const e=commit(Object.assign({kidId,small:delta,label},extra||{}));
  buzz(delta>0?25:90);beep(delta<0?'bad':Math.abs(delta)>=BU()?'big':'good');
  save();
  toast((delta>0?'✅ ':'⚠️ ')+k.name+' '+(delta>0?'+':'−')+fmtScore(Math.abs(delta))+'　'+label,()=>{
    e.voided=true;touch(e);save();toast('已復原');
  });
}
function doRedeem(wid){
  const w=S.rewards.find(x=>x.id===wid);if(!w)return;
  const cost=toSmall(w.unit,w.amount);
  const ks=live(S.kids).filter(k=>!w.kidIds.length||w.kidIds.includes(k.id));
  const body='<div class="f" style="display:flex;gap:12px;align-items:center">'+
    (mediaUrl(w.image)?'<img src="'+mediaUrl(w.image)+'" style="width:64px;height:64px;border-radius:14px;object-fit:cover">':'<div style="font-size:40px">'+esc(w.emoji||'🎁')+'</div>')+
    '<div><b style="font-size:16px">'+esc(w.name)+'</b><div style="color:var(--gold);font-weight:850">需要 '+fmtCost(w.unit,w.amount)+'（'+cost+' 小分）</div>'+
    '<div style="font-size:12px;color:var(--muted)">'+stars(rarity(cost))+' ・ 參考價值 NT$'+valueOf(w)+'</div></div></div>'+
    '<div class="f"><label>誰要兌換？</label>'+ks.map(k=>{
      const bal=balanceOf(k.id),ok=bal>=cost;
      return '<button class="li" style="border:1px solid var(--line);border-radius:12px;margin-bottom:8px" data-act="dordm" data-id="'+w.id+'" data-kid="'+k.id+'" '+(ok?'':'disabled')+'>'+
        avatarHTML(k)+'<div class="tx"><b>'+esc(k.name)+'</b><u>目前 '+fmtScore(bal)+'</u></div>'+
        '<span class="delta '+(ok?'p':'n')+'">'+(ok?'可兌換':'還差 '+(cost-bal)+' 小分')+'</span></button>';
    }).join('')+'</div>';
  sheet('🎁 兌換獎勵',body);
}
function finishRedeem(wid,kidId){
  const w=S.rewards.find(x=>x.id===wid),k=kid(kidId);if(!w||!k)return;
  const cost=toSmall(w.unit,w.amount);
  if(balanceOf(kidId)<cost){toast('分數不足');return}
  const item=isItemReward(w);
  if(item){
    const av=budgetAvail(kidId);
    if(w.price>av){
      toast('獎勵額度只剩 NT$'+av+'，這項要 NT$'+w.price+'　先換特權型的吧');buzz(120);return;
    }
  }
  const go=()=>{
    const e=commit({kidId,small:-cost,label:'兌換：'+w.name,type:'redeem',rewardId:w.id,emoji:w.emoji});
    const c=issueCoupon(kidId,{name:w.name,emoji:w.emoji,kind:item?'item':'privilege',
      source:'redeem',rewardId:w.id,priceNTD:item?w.price:0,ledgerId:e.id});
    if(w.stock!=null){w.stock=Math.max(0,w.stock-1);touch(w)}
    closeSheet();buzz(40);beep('big');save();revealCard(w,k);
    toast('🎉 '+k.name+' 換到「'+w.name+'」'+(item?'　已放進待爸媽處理':'　券已放進「我的券」'),
      ()=>{e.voided=true;touch(e);c.voided=true;touch(c);
           if(w.stock!=null){w.stock++;touch(w)}save();toast('已復原')});
  };
  S.settings.pinForRedeem&&!unlocked()?askPin('兌換需要家長密碼',go):go();
}
function revealCard(w,k){
  const cost=toSmall(w.unit,w.amount),r=rarity(cost);
  const d=document.createElement('div');d.className='reveal';
  const cols=['#7c879f','#12a150','#2f7cf6','#9b4dff','#f0a000'];
  let sp='';for(let i=0;i<26;i++)sp+='<i style="left:'+Math.random()*100+'%;top:-'+(Math.random()*20+5)+'%;background:'+cols[(Math.random()*5)|0]+';animation-delay:'+(Math.random()*.5)+'s"></i>';
  d.innerHTML='<div class="sparks">'+sp+'</div><div class="rc">'+rewardCard(w).replace('<button','<div').replace('</button>','</div>')+
    '</div><div class="cap">'+esc(k.name)+' 換到了！</div>';
  d.addEventListener('click',()=>d.remove());
  document.body.appendChild(d);
  setTimeout(()=>{if(d.parentNode)d.remove()},2600);
}

function toggleVoid(id){
  const e=S.ledger.find(x=>x.id===id);if(!e)return;
  const go=()=>{
    e.voided=!e.voided;touch(e);
    if(e.type==='bank-in'){                        // 存入被撤銷 → 存款單一併作廢，不留孤兒
      const sv=S.savings.find(x=>x.ledgerId===e.id);
      if(sv&&!sv.claimedTs){sv.voided=e.voided;touch(sv)}
      else{                                        // 撤銷的是「加存」→ 只把那一筆從本金扣掉
        const sv2=S.savings.find(x=>(x.addIds||[]).indexOf(e.id)>=0);
        if(sv2&&!sv2.claimedTs){sv2.amount=Math.max(0,sv2.amount+(e.voided?e.small:-e.small));touch(sv2)}
      }
    }
    closeSheet();save();toast(e.voided?'已撤銷':'已恢復')};
  (S.settings.pinForUndo&&!unlocked())?askPin('撤銷需要家長密碼',go):go();
}

function readGhForm(){
  return{owner:$('#go').value.trim(),repo:$('#gr').value.trim(),branch:$('#gb').value.trim()||'main',
    path:$('#gp').value.trim()||'data.json',mediaPath:$('#gm').value.trim()||'media.json',token:$('#gt').value.trim()};
}
async function ghTest(){
  const g=readGhForm(),msg=$('#gmsg');
  msg.innerHTML='檢查中…';
  if(!g.owner||!g.repo||!g.token){msg.innerHTML='<b class="danger">帳號、repo、token 都要填</b>';return}
  try{
    const r=await fetch('https://api.github.com/repos/'+g.owner+'/'+g.repo,
      {headers:{'Authorization':'Bearer '+g.token,'Accept':'application/vnd.github+json'}});
    if(r.status===401)throw new Error('Token 無效或已過期');
    if(r.status===404)throw new Error('找不到這個 repo（名稱錯、或 token 沒有授權這個 repo）');
    if(!r.ok)throw new Error('HTTP '+r.status);
    const j=await r.json();
    msg.innerHTML='<b style="color:var(--good)">✅ 連線成功</b>　'+esc(j.full_name)+(j.private?'（私有）':'（公開）');
  }catch(e){msg.innerHTML='<b class="danger">✗ '+esc(e.message)+'</b>'}
}

  GH=readGhForm();LS.set(K_GH,GH);shaCache={};LS.set(K_SHA,{});

/* ============================================================
   事件總線
   ============================================================ */
document.addEventListener('click',async ev=>{
  const t=ev.target.closest('[data-act]');if(!t)return;
  const a=t.dataset.act,id=t.dataset.id;
  const el=$('#sheet');
  switch(a){
    case 'close':return closeSheet();
    case 'tab':{
      const from=view;view=t.dataset.v;
      if(from==='set'&&view!=='set')unlockUntil=0;   // 離開設定頁就重新上鎖
      render();window.scrollTo(0,0);return;
    }
    case 'unlock':return askPin('請輸入家長密碼',()=>render());
    case 'sel':selKid=id||null;return render();
    case 'kid':selKid=id;view='score';return render();
    case 'roll':return rollDice(selKid);
    case 'freeroll':{const g=gPending;closeSheet();if(!g)return;
      const pp=gp(g.kidId);pp.rollsUsed=Math.max(0,pp.rollsUsed-1);return rollDice(g.kidId)}
    case 'useshield':{const g=gPending;if(!g||!g.ctx.pendingBad)return closeSheet();
      const b=g.ctx.pendingBad;
      const c=S.coupons.find(x=>x.id===b.shieldId);
      if(c){c.usedTs=now();touch(c)}
      commit({kidId:g.kidId,small:0,label:'用護盾擋掉「'+b.label+'」',type:'game',emoji:'🛡️'});
      g.ctx.pendingBad=null;gPending=null;closeSheet();buzz(40);beep('good');save();
      return toast('🛡️ 護盾擋掉了：'+b.label)}
    case 'takehit':{const g=gPending;if(!g||!g.ctx.pendingBad)return closeSheet();
      const b=g.ctx.pendingBad;g.ctx.pendingBad=null;
      const ctx2={log:[],chain:g.ctx.chain,reroll:false,noCoupon:g.ctx.noCoupon,task:null,pendingBad:null};
      applyBad(g.kidId,b,ctx2);
      S.game.updatedAt=now();buzz(120);beep('bad');save();
      return rollResult(g.kidId,S.game.lastRoll||1,ctx2)}
    case 'taskdone':{const g=gPending;if(!g||!g.ctx.task)return closeSheet();
      gPts(g.kidId,g.ctx.task.value,'命運任務：'+g.ctx.task.label,'😈',[]);
      gPending=null;closeSheet();buzz(40);beep('big');save();return toast('👏 完成任務 +'+g.ctx.task.value)}
    case 'rwtab':rwTab=t.dataset.v;return render();
    case 'calc':return calcSheet();
    case 'ghelp':return gameHelpSheet();
    case 'crange':chartRange=t.dataset.v;chartPick=null;return render();
    case 'compact':{
      const n=oldCount();
      if(!n)return toast('一年內的紀錄都還在，不用壓縮');
      return sheet('📦 壓縮一年前的紀錄',
        '<div class="f hint" style="margin-top:-6px;line-height:1.85">有 <b>'+n+' 筆</b>超過一年的紀錄。<br>'+
        '壓縮之後這些明細會收起來，<b>每個小孩的分數、累積總分都不會變</b>（會存成一筆起始底數）。<br>'+
        '這樣資料檔比較小，手機開起來也比較快。</div>'+
        '<button class="btn pri wide" data-act="docompact">壓縮這 '+n+' 筆</button>'+
        '<button class="btn ghost wide" style="margin-top:8px" data-act="close">先不要</button>');
    }
    case 'docompact':return compactOld();
    case 'cpick':{const i=parseInt(t.dataset.i,10);chartPick=(chartPick===i?null:i);return render()}
    case 'topup':topUpAmt=Math.max(1,(10-((S.savings.find(x=>x.id===id)||{amount:0}).amount%10))%10||5);return topUpSheet(id);
    case 'tu+':topUpAmt=clamp(topUpAmt+1,0,999);return topUpSheet(id);
    case 'tu-':topUpAmt=clamp(topUpAmt-1,0,999);return topUpSheet(id);
    case 'dotu':return topUp(id,clamp(topUpAmt,0,balanceOf((S.savings.find(x=>x.id===id)||{}).kidId)));
    case 'dep+':depAmt=clamp(depAmt+(depAmt>=20?10:5),0,999);return render();
    case 'dep-':depAmt=clamp(depAmt-(depAmt>20?10:5),0,999);return render();
    case 'dodep':return deposit(selKid,clamp(depAmt,0,balanceOf(selKid)),parseInt(t.dataset.d));
    case 'claim':return claimSaving(id);
    case 'breaksv':return breakSaving(id);
    case 'cpn':return cpnSheet(id);
    case 'usecpn':closeSheet();return useCoupon(id);
    case 'cancelcpn':return cancelCoupon(id);
    case 'rt':return toggleRoutine(t.dataset.kid,id);
    case 'rule':return applyRule(id,t.dataset.ask==='1');
    case 'ruleFor':{closeSheet();selKid=t.dataset.kid;return applyRule(id,false)}
    case 'manual':return manualSheet();
    case 'mdo':{

    case 'dordm':return finishRedeem(id,t.dataset.kid);
    case 'entry':return entrySheet(id);
    case 'toggleVoid':return toggleVoid(id);
    case 'syncpanel':return ghReady()?(view='set',render(),window.scrollTo(0,0)):ghSetup();

    case 'mkids':return manageKids();
    case 'editkid':return editKid(id);
    case 'pickav':return pickImage(d=>el._setav(putMedia(d)));
    case 'rmav':return el._setav(null);
    case 'savekid':{
      const g=el._get(),nm=g.name||'寶貝';
      if(id){const k=kid(id);Object.assign(k,{name:nm,color:g.color,avatar:g.avatar});touch(k)}
      else S.kids.push(touch({id:uid('k'),name:nm,color:g.color,avatar:g.avatar,sort:S.kids.length}));
      closeSheet();save({media:true});return toast('已儲存');
    }
    case 'delkid':{
      if(!confirm('刪除後這位小孩的分數與紀錄不再顯示，確定？'))return;
      const k=kid(id);k.deleted=true;touch(k);if(selKid===id)selKid=null;closeSheet();save();return toast('已刪除');
    }
    case 'mrt':return manageRt();
    case 'editrt':return editRt(id);
    case 'savert':{
      const g=el._get();
      const o={label:$('#tl').value.trim()||'未命名',emoji:$('#te').value.trim()||'⭐',
               dice:clamp(parseInt($('#td').value)||0,0,9),kidIds:g.kidIds};
      if(id)Object.assign(touch(S.routines.find(x=>x.id===id)),o);
      else S.routines.push(touch(Object.assign({id:uid('t'),sort:S.routines.length},o)));
      closeSheet();save();return toast('已儲存');
    }
    case 'delrt':{const r=S.routines.find(x=>x.id===id);r.deleted=true;touch(r);closeSheet();save();return toast('已刪除')}
    case 'rtbonus':return rtBonusSheet();
    case 'savertb':{
      const st=S.settings;
      st.routineAllBonus=Math.max(0,parseInt($('#b1').value)||0);
      st.streak3Bonus=Math.max(0,parseInt($('#b2').value)||0);
      st.streak7Bonus=Math.max(0,parseInt($('#b3').value)||0);
      st.dicePerPoints=Math.max(1,parseInt($('#b4').value)||5);
      touch(st);closeSheet();save();return toast('已儲存');
    }
    case 'mrules':return manageRules();
    case 'editrule':return editRule(id,t.dataset.kind);
    case 'saverule':{
      const o={label:$('#rl').value.trim()||'未命名',emoji:$('#re').value.trim(),kind:$('#rk').value,
               unit:$('#ru').value,amount:Math.max(1,parseInt($('#ra').value)||1)};
      if(id)Object.assign(touch(S.rules.find(x=>x.id===id)),o);
      else S.rules.push(touch(Object.assign({id:uid('r'),sort:S.rules.length},o)));
      closeSheet();save();return toast('已儲存');
    }
    case 'delrule':{const r=S.rules.find(x=>x.id===id);r.deleted=true;touch(r);closeSheet();save();return toast('已刪除')}
    case 'calcpts':{
      const pr=Math.max(0,parseInt($('#wp').value)||0);
      if(!pr)return toast('先填價格');
      const small=Math.max(1,Math.round(pr/NTD()));
      if(small>=BU()&&small%BU()===0){$('#wu').value='big';$('#wa').value=small/BU()}
      else{$('#wu').value='small';$('#wa').value=small}
      return toast('NT$'+pr+' → '+small+' 小分');
    }
    case 'mrw':return manageRw();
    case 'editrw':return editRw(id);
    case 'pickrw':return pickImage(d=>el._setimg(d));
    case 'rmrw':return el._setimg(null);
    case 'saverw':{
      const g=el._get(),st=$('#ws').value.trim();
      const pr=$('#wp').value.trim();
      const o={name:$('#wn').value.trim()||'未命名',emoji:$('#we').value.trim()||'🎁',
        unit:$('#wu').value,amount:Math.max(1,parseInt($('#wa').value)||1),
        price:pr===''?null:Math.max(0,parseInt(pr)||0),
        stock:st===''?null:Math.max(0,parseInt(st)||0),note:$('#wt').value.trim(),kidIds:g.kidIds};
      let media=false;
      if(g.img&&g.img.startsWith('data:')){o.image=putMedia(g.img);media=true}else if(!g.img)o.image=null;

      else S.rewards.push(touch(Object.assign({id:uid('w'),sort:S.rewards.length},o)));
      closeSheet();save({media});return toast('已儲存');
    }
    case 'delrw':{const w=S.rewards.find(x=>x.id===id);w.deleted=true;touch(w);closeSheet();save();return toast('已刪除')}

    case 'rates':{
      const ps=plans().slice().sort((a,b)=>a.days-b.days);
      sheet('🏦 銀行利率',
        '<div class="f hint" style="margin-top:-6px">利息以「每滿 10 小分」計算，零頭不計息。到期後停止計息。</div>'+
        ps.map((pl,i)=>'<div class="f2"><div class="f"><label>第 '+(i+1)+' 檔：天數</label>'+
          '<input id="pd'+i+'" type="number" inputmode="numeric" min="1" value="'+pl.days+'"></div>'+
          '<div class="f"><label>每 10 小分 +</label><input id="pp'+i+'" type="number" inputmode="numeric" min="0" value="'+pl.per10+'"></div></div>').join('')+
        '<div class="f"><label>單筆利息上限（小分）</label><input id="pcap" type="number" inputmode="numeric" min="0" value="'+capInt()+'"></div>'+
        '<button class="btn pri wide" data-act="saverates">儲存</button>');

      if(!out.length)return toast('至少要有一檔');
      S.settings.plans=out.sort((a,b)=>a.days-b.days);
      S.settings.interestCap=Math.max(0,parseInt($('#pcap').value)||0);
      touch(S.settings);closeSheet();save();return toast('利率已更新');

    case 'budget':{
      const v=prompt('每人每週的實體獎勵額度是多少元？\n（只有標價格的獎勵會扣額度，特權型不扣；沒用完會累積）',weeklyNTD());
      if(v==null)return;
      S.settings.weeklyBudgetNTD=Math.max(0,parseInt(v)||0);touch(S.settings);save();
      return toast('每週額度 NT$'+weeklyNTD());
    }
    case 'ntdrate':{
      const v=prompt('1 小分 = 幾元？（獎勵品價格換算用）',NTD());if(v==null)return;
      const n=clamp(parseInt(v)||10,1,1000);S.settings.ntdPerSmall=n;touch(S.settings);save();
      return toast('1 小分 = NT$'+n+'（1 大分 = NT$'+(n*BU())+'）');
    }
    case 'reseed':{
      if(!confirm('把「規則」與「獎勵品」換成最新預設清單？\n小孩、分數、紀錄都會保留。'))return;
      const fresh=seed();
      for(const r of S.rules)if(!r.deleted){r.deleted=true;touch(r)}
      for(const w of S.rewards)if(!w.deleted){w.deleted=true;touch(w)}
      S.rules=S.rules.concat(fresh.rules);S.rewards=S.rewards.concat(fresh.rewards);
      S.needsSeedRefresh=false;touch(S.settings);closeSheet();save();return toast('已載入最新預設清單');
    }
    case 'bigunit':{
      const v=prompt('1 大分 = 幾小分？（建議 5）',BU());if(v==null)return;
      const n=clamp(parseInt(v)||5,2,50);S.settings.bigUnit=n;touch(S.settings);save();return toast('1 大分 = '+n+' 小分');
    }
    case 'tgneg':S.settings.allowNegative=!S.settings.allowNegative;touch(S.settings);return save();
    case 'tgundo':S.settings.pinForUndo=!S.settings.pinForUndo;touch(S.settings);return save();
    case 'tgredeem':S.settings.pinForRedeem=!S.settings.pinForRedeem;touch(S.settings);return save();
    case 'tgsound':S.settings.sound=!S.settings.sound;touch(S.settings);beep('good');return save();
    case 'tghap':S.settings.haptics=!S.settings.haptics;touch(S.settings);buzz();return save();
    case 'theme':{
      const o=['auto','light','dark'],i=(o.indexOf(S.settings.theme)+1)%3;
      S.settings.theme=o[i];touch(S.settings);applyTheme();return save();
    }
    case 'setpin':return setPinSheet();
    case 'savepin':{
      const a=$('#p1').value.trim(),b=$('#p2').value.trim();
      if(a===''&&b===''){S.settings.pinHash=null;touch(S.settings);closeSheet();save();return toast('已取消密碼')}
      if(!/^\d{4}$/.test(a))return toast('請輸入 4 位數字');
      if(a!==b)return toast('兩次輸入不一樣');
      S.settings.pinHash=h33(a);touch(S.settings);unlockUntil=now()+10*60*1000;closeSheet();save();return toast('密碼已設定');
    }
    case 'ghsetup':return ghSetup();
    case 'ghtest':return ghTest();
    case 'ghsave':return ghSave();
    case 'ghpull':return pull();
    case 'ghpush':return push().then(()=>toast(syncState==='err'?'上傳失敗：'+syncMsg:'已上傳'));
    case 'backup':return backupSheet();
    case 'dlbak':{
      const blob=new Blob([JSON.stringify({state:S,media:M},null,1)],{type:'application/json'});
      const u=URL.createObjectURL(blob),aa=document.createElement('a');
      aa.href=u;aa.download='kidpoints-'+new Date().toISOString().slice(0,10)+'.json';aa.click();
      setTimeout(()=>URL.revokeObjectURL(u),3000);return;
    }
    case 'dobak':{
      try{
        const j=JSON.parse($('#bk').value);
        if(j.state)S=mergeState(S,j.state);
        if(j.media)M=mergeMedia(M,j.media);
        closeSheet();save({media:true});return toast('已還原合併');
      }catch(e){return toast('JSON 格式不正確')}
    }
    case 'clearlog':{
      if(!confirm('清空所有加減分紀錄？分數會全部歸零。'))return;
      S.ledger=[];S.routineLog=[];S.coupons=[];S.savings=[];
      S.game.players={};S.game.updatedAt=now();S.settings.ledgerClearedAt=now();touch(S.settings);save();return toast('紀錄已清空');
    }
    case 'reset':{
      if(!confirm('回復成預設資料？現有小孩、規則、獎勵、紀錄都會不見。'))return;
      S=seed();M={updatedAt:now(),items:{}};selKid=null;save({media:true});return toast('已回復預設');
    }
  }
});

/* ---------- 主題 / 啟動 ---------- */
function applyTheme(){
  const t=S.settings.theme||'auto';
  document.documentElement.setAttribute('data-theme',t==='auto'?'':t);
  if(t==='auto')document.documentElement.removeAttribute('data-theme');
}
applyTheme();
render();
if(firstRun)setTimeout(()=>{if(!$('#toast').classList.contains('on'))toast('👋 先去「設定」改小孩名字和規則')},900);
if(ghReady())pull(true);
window.KP={get S(){return S},get M(){return M},addPoints,balanceOf,fmtScore,mergeState,mergeLedger,render,
  diceOf,streakOf,allDone,doneCount,routineDone,routinesFor,dayKey,toggleRoutine,
  budgetAvail,budgetUsed,budgetAllowance,usedThisWeek,couponsOf,issueCoupon,useCoupon,weeklyNTD,
  deposit,claimSaving,breakSaving,interestFor,bankedOf,liveSavings,isMature,matureCount,daysLeft,plans,
  rollDice,gp,tileAt,step,shieldsOf,landOn,lapBonus,chainCap,mergeGame,offerShield,applyBad,tileDesc,tileSheet,
  topUp,topUpSheet,calcSheet,gameHelpSheet,compactOld,oldCount,archiveCut,chartSeries,chartBox,earnedOf,arcOf,
  set topUpAmt(v){topUpAmt=v},get topUpAmt(){return topUpAmt},
  set chartRange(v){chartRange=v},get chartRange(){return chartRange},
  set chartPick(v){chartPick=v},get chartPick(){return chartPick},
  get gPending(){return gPending},set gPending(v){gPending=v},
  set depAmt(v){depAmt=v},get depAmt(){return depAmt},
  set rwTab(v){rwTab=v;render()},get rwTab(){return rwTab},
  set view(v){view=v;render()},get view(){return view},set selKid(v){selKid=v},get selKid(){return selKid}};
</script>
